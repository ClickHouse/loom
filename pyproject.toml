[project]
name = "clickhouse-loom-server"
version = "1.1.0"
description = "Loom server (control plane). Shared-production agent memory + knowledge plane on ClickHouse. Distributed as a Docker image (ghcr.io/clickhouse/loom) — `pip install` is for local dev / Docker-image build only; do NOT run the server from pip in production."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "ClickHouse, Inc." }]
urls = { Repository = "https://github.com/ClickHouse/loom" }
# PEP 541: PyPI rejects uploads whose primary classifier is "Private ::
# Do Not Upload". Loom's server is a shared-production data plane,
# deployed multi-user / multi-agent against ClickHouse Cloud or self-
# hosted OSS ClickHouse — not something developers pip-install on a
# laptop. The Docker image at ghcr.io/clickhouse/loom is the canonical
# server artefact. The SDK (`clickhouse-loom` at sdk/python/) is what's
# published to PyPI for application developers.
classifiers = ["Private :: Do Not Upload"]

dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # The YAML settings file (server/settings/_file.py); uvicorn[standard] pulls it in too.
  "pyyaml>=6.0",
  "clickhouse-connect>=1.7", # older ones drop milliseconds (<1.2) or bind a naive datetime as local time
  "aiohttp>=3.10",           # clickhouse-connect's async client requires it
  "httpx[http2]>=0.27",
  "idna>=3.7",               # UTS 46 host names: server.settings.catalog.ascii_host
  "dnspython>=2.6",          # a cancellable lookup for names a tenant chooses: server.core.hosts
  "tenacity>=9.0",
  "pyjwt[crypto]>=2.10",
  # OpenTelemetry: ship spans + logs to HyperDX / ClickStack's OTLP
  # collector. ClickStack is the OTel consumer in the Loom stack
  # (docs/features/integrations/clickstack.md); this wires the producer side.
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  # Logs API + the SDK's logging.Handler bridge that auto-attaches
  # trace_id/span_id from the active span. Logs land alongside traces
  # in HyperDX, correlated by trace_id so a single click jumps from
  # one to the other.
  "opentelemetry-instrumentation-logging>=0.48b0",
  # Password hashing for email+password sign-in. argon2id is the
  # modern OWASP-preferred KDF; argon2-cffi is the canonical Python
  # binding. Used by server.auth.passwords (hash / verify / rehash).
  "argon2-cffi>=23.1",

  # English Porter (Snowball) stemmer for verb canonicalization in
  # entity_triples. Pure-Python, no model download. Used by
  # `canonicalize_verb` in server.memory.app.retrieval; the
  # stemmer collapses inflected forms (visited/visiting/visits → visit)
  # so triple-store matches across write/query verb tense.
  "snowballstemmer>=2.2",
  # RE2 (linear-time, no backtracking) for caller-supplied regexes matched in
  # Python: code.grep's line step and context.fetch. Same engine as ClickHouse's
  # match(), so a pattern means the same thing in both places.
  "google-re2>=1.1",
  # Postgres for the Postgres storage profile (LOOM_STORAGE_AUTHORITY=postgres): the async
  # driver and its pool. Imported only when that profile is configured.
  "asyncpg>=0.30",
  # lemmagen3 (the English lemmatizer) is the `[lemma]` extra below, not a
  # core dep: it ships no wheel and compiles against Python.h, and a host
  # that only wants the `loom` CLI (`loom up`) may have no build toolchain.
]

[project.optional-dependencies]
# Lemmagen3 English lemmatizer — covers irregular morphology Snowball misses
# (went/go, mice/mouse, children/child). Matches ClickHouse's
# lemmatize('en', ...) byte-for-byte: deploy/lemmagen3/en.bin, which ClickHouse
# loads, is the model this wheel ships. The Docker image installs it (Dockerfile EXTRAS) and so
# does `[dev]`; `server/memory/domain/lemmatize.py` imports it lazily and falls
# open to the plain tokens when it is absent, so a host running only the CLI
# never compiles it. A host-run *server* without it writes
# unlemmatized `content_excerpt_lemma` — install `.[lemma]` for `make server`.
lemma = [
  "lemmagen3>=3.3",
]
dev = [
  "lemmagen3>=3.3",                    # the server's own lexical leg; tests exercise it
  "clickhouse-loom-server[aws]",       # the export-analytics tests exercise boto3
  "clickhouse-loom-server[extractor]", # the extractor's parser tests parse every format
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.32",
  "pytest-rerunfailures>=15.0",
  "pytest-cov>=5.0",
  # Unit tests run in a random order with the seed CI prints (tests/README.md).
  "pytest-randomly>=3.15",
  # The unit job spreads the suite over the runner's cores (`-n auto`).
  "pytest-xdist>=3.6",
  # The ratchets count mypy errors and ruff findings per file; a new release
  # moves those counts with no code change, so both are pinned.
  "mypy==2.3.1",
  "types-PyYAML>=6.0",
  "ruff==0.16.9",
  "build>=1.0",
]
# Operator CLI extra — needed only by `dev/loom_ingest.py` to fetch an S3
# source. Not a server dep; the CLI lazy-imports it with an actionable error
# message when missing. It parses nothing: the server's extractor does.
ingest = [
  "boto3>=1.36", # the document bucket client's checksum options; see `aws`
]
# The reference extractor's parsers (extractor/loom_extractor/), for its tests in this
# environment. The server never imports them; the service installs extractor/pyproject.toml.
extractor = [
  "cryptography>=50,<51", # pypdf's AES: a PDF encrypted with an owner password alone opens
  "pyarrow>=26,<27",      # Parquet: a major may change what its decoder accepts, reviewed before a bump
  "pypdf>=6.21,<7",
  "sqlglot>=30.27,<31",   # imports sqlglot.tokenizer_core, which a major may move
]
# `loom export-analytics` uploads to S3 under an assumed role, and
# LOOM_DOCUMENT_OBJECT_STORE=s3 keeps document originals in a bucket; ships in the image.
aws = [
  # 1.36: the first whose client config takes the checksum options the document
  # bucket client sets (put_object's IfNoneMatch came in 1.35.2)
  "boto3>=1.36",
]
# Code intelligence plane: tree-sitter parses C++ for
# the fast tier, numpy runs the weekly PageRank. Needed only when the code
# workers / `loom code` CLI are used — all imports are lazy, the server
# boots without these while the workers stay disabled.
code = [
  "tree-sitter>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-bash>=0.23",
  # TypeScript (+ tsx), JavaScript and Rust
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-rust>=0.23",
  # Go and Java (lane parsers + SQL islands)
  "tree-sitter-go>=0.23",
  "tree-sitter-java>=0.23",
  "numpy>=1.26",
]
# scripts/scip_harness only (protobuf parse of scip-clang output). Never a
# server dep — the server ingests the normalized JSON delta.
scip = [
  "protobuf>=7.35.1",
]
# Local CPU embedder extras, for LOOM_EMBEDDING_MODEL=local*: the image installs
# them and the released stack embeds with them. fastembed pulls in onnxruntime
# (~80MB wheel); the model files are pinned in server/embedding/local_models.py.
# Lazy-imported by server/embedding/local.py with an actionable error
# message when missing.
local-embedder = [
  "fastembed>=0.9.1", # the first to allow pillow 13, which fixes critical CVEs in 12.x
]

[project.scripts]
# `loom` CLI — bundled INSIDE the Docker image for operator use.
# Not exposed via PyPI (root pyproject is Private :: Do Not Upload).
# Operators run it via `docker exec loom-server loom mint-token ...` or
# the equivalent on whatever orchestrator hosts the container. From a clone,
# `pip install -e .` puts it on the host too — no compiler needed:
# lemmagen3 is in the `[lemma]` extra.
#   loom up            # boot the local stack + print how to connect
#   loom serve         # boot the control plane (the image runs uvicorn directly)
#   loom migrate       # apply schema migrations
#   loom mint-token    # issue a JWT (operator's path; needs LOOM_JWT_SECRET)
loom = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Server-only wheel. The SDK has its own pyproject at sdk/python/
# (published to PyPI as `clickhouse-loom`); this root pyproject builds
# the server wheel that the Dockerfile installs into the image.
packages = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 0.23+ defaults to a fresh event loop per fixture and
# per test, which breaks the integration tests' module-scope async
# fixtures (they connect a CH client at module scope and reuse it
# across tests). The fixture's awaitables bind to loop A, then test 2
# runs on loop B and tries to await them — "Future attached to a
# different loop". Setting both scopes to "session" gives every test
# and fixture in the process one shared loop. The integration tests talk to the control plane over HTTP
# (separate process), so in-process loop sharing has no contention
# risk.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# The reference extractor is its own package, outside the server wheel.
pythonpath = ["extractor"]
# A mark that is not registered here or by a plugin is an error, not a
# silent no-op: a typo in a tier marker would otherwise leave the test in the
# default tier. tests/README.md says which CI job runs each tier.
strict_markers = true
markers = [
  "slow: takes more than a few seconds; runs in the integration job, never in unit",
  "destructive: stops merges, drops or rewrites shared objects; needs a disposable ClickHouse",
  "provider: calls a real LLM or embedding provider; skips without its key",
  "recovery: kills, restarts or resumes a worker, saga or migration mid-flight",
  "copy_head_check: a unit test that runs the post-copy head re-check (off by default in unit)",
  "doctor_tier_read: a unit test that runs loom doctor's read of the failing code-index tiers (off by default in unit)",
  "claim_cap: a unit test that runs the namespace gate's claim cap (off by default in unit)",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["server", "sdk/python/loom", "extractor/loom_extractor"]
mypy_path = "extractor"
exclude = ["tests/"]

# Optional packages imported lazily with a fallback, present in some
# environments and not others: lemmagen3 comes with `[dev]` and `[lemma]`,
# fastembed with `[local-embedder]`, and tiktoken is undeclared (the
# embedders approximate token counts without it). mypy's error for them
# would differ by environment; their call sites are typed through local
# Protocols.
[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "lemmagen3", "tiktoken", "tiktoken.*"]
ignore_missing_imports = true

# pyarrow ships no type information; the extractor's Parquet reader types what it reads as Any.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# google-re2 ships no type information; server/core/caller_regex.py types its result as Any.
[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true

# asyncpg (the Postgres memory authority's driver) ships no type information.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# boto3 is the SDK's and the server's optional `aws` extra (a bot key in Secrets
# Manager, `loom export-analytics`, the document bucket), and ships no types.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

# The SDK's framework adapters: langgraph and strands are optional, so each adapter
# subclasses the real base class when it imports and a structural twin otherwise.
# Without the framework the base is Any, which strict mode refuses to subclass.
[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*", "strands", "strands.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["loom.integrations.*"]
disallow_subclassing_any = false

[tool.coverage.run]
# Coverage is measured over the unit suite in CI: each `unit` part writes its data,
# the `unit-coverage` job combines them and applies the floors. Integration
# tests run the server out-of-process so they don't contribute to in-process
# coverage; treat this as a unit-coverage floor, not a total.
source = ["server", "sdk/python/loom"]
# The C tracer, which `sys.settrace(None)` pauses: `untraced` (tests/unit/code_fixtures.py)
# times code with it off, for the extraction tests' time bounds and the lane timings.
core = "ctrace"
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
# Keep precision modest — this is a regression guard, not a vanity metric.
precision = 0

[tool.ruff]
line-length = 100
# First-party packages: the server from the root, the reference extractor from its directory.
src = [".", "extractor"]
target-version = "py312"
# The SDK supports Python 3.11 (sdk/python/pyproject.toml requires-python), so
# its lint rules must not rewrite it to newer syntax. The wheel smoke test runs
# on that floor too.
per-file-target-version = { "sdk/python/**" = "py311", "scripts/gates/sdk_wheel_smoke.py" = "py311" }
# Generated protobuf bindings keep their generated form.
extend-exclude = ["scripts/scip_harness/vendor"]

[tool.ruff.format]
# Formatting is `ruff format`; these paths keep their bytes.
exclude = [
  # Inputs whose exact bytes and line numbers tests assert on.
  "tests/fixtures/**",
  "scripts/scip_harness/vendor/**",
  # Generated by scripts/codegen/sdk_py_gen.py and sdk_py_client_gen.py; their --check compares bytes.
  "sdk/python/loom/ops.py",
  "sdk/python/loom/client.py",
  # Extractor modules: their code tokens are the code index's version stamp
  # and a formatter may rewrite string quotes, which would re-index every
  # repository. Kept in step with extractor_stamp.EXTRACTOR_MODULES by
  # tests/unit/test_format_excludes_extractor_modules.py.
  "server/code/domain/extract/call_guards.py",
  "server/code/domain/extract/callee_outline.py",
  "server/code/domain/extract/chunker.py",
  "server/code/domain/extract/context_text.py",
  "server/code/domain/extract/cpp_receivers.py",
  "server/code/domain/extract/crossref.py",
  "server/code/domain/extract/edges_treesitter.py",
  "server/code/domain/extract/lang_bash.py",
  "server/code/domain/extract/lang_python.py",
  "server/code/domain/extract/py_layouts.py",
  "server/code/domain/extract/py_library_methods.py",
  "server/code/domain/extract/py_members.py",
  "server/code/domain/extract/py_receivers.py",
  "server/code/domain/extract/registration.py",
  "server/code/domain/extract/spans.py",
  "server/code/domain/extract/tokenize.py",
  "server/code/domain/extract/treesitter.py",
  "server/code/domain/extract/ts_config.py",
  "server/code/domain/extract/ts_receivers.py",
  "server/code/domain/extract/ts_reexports.py",
  "server/code/domain/extract/ts_workspace.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "BLE", "RUF100"]
# PLR0915 runs from scripts/gates/function_length_gate.py, not from this config:
# its noqa comments are used there.
external = ["PLR0915"]

# Tests get more slack on line length — assertions, SQL string literals,
# and JSON fixtures often run long and reflowing them harms readability.
# Production code keeps the 100-char rule.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
# Generated by scripts/codegen/sdk_py_gen.py and sdk_py_client_gen.py: their file-level noqa is the generator's, not ours to prune.
"sdk/python/loom/ops.py" = ["RUF100"]
"sdk/python/loom/client.py" = ["RUF100"]
# Bench scripts are short-lived runners (one-shot, asyncio.run from
# main). ASYNC230/240 catch blocking IO inside async funcs — meant
# for library code where it stalls the event loop. Bench scripts
# don't have loop contention to worry about.
"bench/**/*.py" = ["ASYNC230", "ASYNC240"]
# These two modules carry the LLM extraction / query-enrichment prompts:
# multi-line few-shot JSON examples plus inline graph SQL. The long lines ARE the string content;
# reflowing them either changes what the model sees or splits SQL awkwardly,
# and `# noqa` can't target a line inside a triple-quoted literal. Same
# rationale as the tests exemption above.
"server/memory/app/extract/*.py" = ["E501"]
# Holds the extraction LLM prompt literals (few-shot JSON examples). Same
# rationale: the long lines ARE the string content.
"server/memory/domain/extraction_prompts.py" = ["E501"]
"server/memory/app/retrieval/*.py" = ["E501"]
# Holds the search-pipeline LLM prompt literals.
"server/memory/domain/search_prompts.py" = ["E501"]
