# LibreChat v0.8.8 and its MongoDB, for evaluating the Loom integration locally.
# Message search (Meilisearch), the RAG API and its vector database are left out:
# nothing here copies or indexes tenant content outside Loom.
name: loom-librechat

services:
  api:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8@sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    depends_on:
      - mongodb
    ports:
      - "127.0.0.1:${LIBRECHAT_PORT:-3080}:3080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${LIBRECHAT_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      SEARCH: "false"
    volumes:
      - ${LIBRECHAT_CONFIG:-./librechat.yaml}:/app/librechat.yaml:ro
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    # No host port: only the api container reaches it, on the compose network.
    command: mongod --noauth --quiet
    volumes:
      - mongo:/data/db
    restart: unless-stopped

volumes:
  mongo:
  uploads:
  logs:
