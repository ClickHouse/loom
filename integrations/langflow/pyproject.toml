[project]
name = "lfx-loom"
version = "0.1.0"
description = "Save and search Loom memory and search knowledge documents in Langflow."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["lfx==1.13.3", "clickhouse-loom>=1.2.0,<2"]

[project.urls]
Repository = "https://github.com/ClickHouse/loom"
Documentation = "https://github.com/ClickHouse/loom/tree/main/integrations/langflow"

[project.entry-points."langflow.extensions"]
lfx-loom = "lfx_loom"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_loom"]

[tool.hatch.build.targets.wheel.force-include]
"extension.json" = "lfx_loom/extension.json"
"loom_component.py" = "lfx_loom/components/loom/loom_component.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/lfx_loom",
  "/extension.json",
  "/loom_component.py",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
]
