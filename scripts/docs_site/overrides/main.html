{% extends "base.html" %}
{% block extrahead %}
  {% set desc = page.meta.description if page and page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ (page.title ~ ' - ' ~ config.site_name if page and page.title and not page.is_homepage else config.site_name) | e }}">
  <meta property="og:description" content="{{ desc }}">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta property="og:image" content="https://raw.githubusercontent.com/ClickHouse/loom/main/.github/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  {% if page and page.is_homepage %}
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "SoftwareApplication",
   "name": "ClickHouse Loom", "applicationCategory": "DeveloperApplication",
   "operatingSystem": "Linux, macOS, Windows (Docker), Kubernetes",
   "description": {{ config.site_description | tojson }},
   "url": {{ config.site_url | tojson }}, "license": "https://www.apache.org/licenses/LICENSE-2.0",
   "sameAs": ["https://github.com/ClickHouse/loom", "https://pypi.org/project/clickhouse-loom/", "https://www.npmjs.com/package/@clickhouse/loom"]}
  </script>
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "SoftwareSourceCode", "name": "ClickHouse Loom",
   "codeRepository": "https://github.com/ClickHouse/loom", "license": "https://www.apache.org/licenses/LICENSE-2.0",
   "programmingLanguage": ["Python", "TypeScript"], "description": {{ config.site_description | tojson }}}
  </script>
  {% endif %}
{% endblock %}
