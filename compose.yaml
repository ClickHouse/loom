# Loom, and by default its own ClickHouse.
#
#   COMPOSE_PROFILES=bundled   start the clickhouse service below (the default)
#   COMPOSE_PROFILES=          use the ClickHouse that LOOM_CH_* in .env names:
#                              a self-managed server or ClickHouse Cloud
#   ...,assistant              also run the assistant's LibreChat (librechat below)
#
# install.sh writes .env for either choice, and docs/operations/deployment.md
# covers both. The release bundle ships this file with the repository's layout,
# so the same file runs from a clone (dev/docker-compose.dev.yml adds the source
# build) and from an install directory.

services:
  clickhouse:
    profiles: [bundled]
    # The latest release, as CI runs (dev/ci_start_clickhouse.sh); a release
    # bundle names the one that was latest when it was built.
    # LOOM_CLICKHOUSE_IMAGE pins another, e.g. clickhouse/clickhouse-server:head
    # for a master build (unsupported).
    image: ${LOOM_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: loom
      CLICKHOUSE_USER: loom
      CLICKHOUSE_PASSWORD: loomdev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - loom-ch-data:/var/lib/clickhouse
      # The English lemmatizer for ad-hoc lemmatize('en', ...) queries.
      - ./deploy/lemmagen3:/var/lib/clickhouse/lemmagen3:ro
      - ./deploy/clickhouse-config/lemmatizers.xml:/etc/clickhouse-server/config.d/lemmatizers.xml:ro
      # The loom_reader user and profile, the tenant quota, the NLP flags.
      - ./deploy/clickhouse-config/nlp_user_settings.xml:/etc/clickhouse-server/users.d/nlp_user_settings.xml:ro
      # An embedded single-node Keeper for the KeeperMap tables.
      - ./deploy/clickhouse-config/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      # A user with no row policy on a table reads none of it.
      - ./deploy/clickhouse-config/access_control.xml:/etc/clickhouse-server/config.d/access_control.xml:ro
      # Named collections for the SQL ai* functions; defines none as shipped.
      # Git-ignored, so `make bootstrap` makes it: a missing file is an error,
      # not a root-owned directory Docker creates in its place.
      - type: bind
        source: ./deploy/clickhouse-config/named_collections.xml
        target: /etc/clickhouse-server/config.d/named_collections.xml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  loom:
    image: "${LOOM_IMAGE_REPOSITORY:-ghcr.io/clickhouse/loom}:${LOOM_VERSION:-latest}"
    # The per-server runtime files (server/core/runtime_files.py), empty on every start.
    tmpfs:
      - /run/loom:uid=999,gid=999,mode=0700
    restart: unless-stopped
    # Uvicorn waits LOOM_GRACEFUL_SHUTDOWN_S (10 s) for in-flight requests, then
    # the lifespan drains run; Docker's default 10 s would kill them mid-drain.
    stop_grace_period: 75s
    depends_on:
      clickhouse:
        condition: service_healthy
        # Skipped when the bundled profile is off.
        required: false
    ports:
      - "${LOOM_BIND_HOST:-127.0.0.1}:${LOOM_PORT:-7777}:7777"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # A ClickHouse on the Docker host is host.docker.internal, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Unset in .env means the bundled clickhouse service.
      LOOM_CH_HOST: "${LOOM_CH_HOST:-clickhouse}"
      LOOM_CH_PORT: "${LOOM_CH_PORT:-8123}"
      LOOM_CH_USER: "${LOOM_CH_USER:-loom}"
      # Only an unset password means the bundled one; an empty one stays empty.
      LOOM_CH_PASSWORD: "${LOOM_CH_PASSWORD-loomdev}"
      LOOM_CH_READER_USER: "${LOOM_CH_READER_USER-loom_reader}"
      # One source for both ends: the extractor's token is interpolated the same way,
      # so a shell export cannot give the two services different tokens.
      LOOM_DOCUMENT_EXTRACTOR_TOKEN: "${LOOM_DOCUMENT_EXTRACTOR_TOKEN:-}"
      LOOM_DEPLOYMENT: "1"
      LOOM_INSTANCE_LABEL: "deploy:standalone"
      # The address the port is published on; see docs/operations/deployment.md.
      LOOM_BIND_HOST: "${LOOM_BIND_HOST:-127.0.0.1}"
      # Two processes unless .env names a count. The bundled ClickHouse may share
      # this host and the container has no limits, so the image's own default
      # (one per host CPU and GiB) could leave it no room.
      LOOM_WEB_WORKERS: "${LOOM_WEB_WORKERS:-2}"
      # The assistant profile's LibreChat; unset, the server sets no assistant up.
      LOOM_ASSISTANT_LIBRECHAT_URL: "${LOOM_ASSISTANT_LIBRECHAT_URL:-}"
    volumes:
      - loom-code-repos:/app/var/code_repos
    networks: [default, extractor, assistant]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7777/v1/health/ready',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Readiness, not liveness. A boot can wait up to 900 s on another
      # process's migration lease before it applies or finds nothing pending.
      start_period: 900s

  # The document parsers, apart from the server: it holds no Loom or database
  # credential, its network is internal (no route out) and shared with the loom
  # service alone, which reaches it at LOOM_DOCUMENT_EXTRACTOR_URL with the token
  # .env holds. Each extraction runs under a filter that makes no socket, so one
  # a hostile file takes over reaches nothing, loom included, while extractions
  # run one at a time, as here (docs/architecture/document-extraction.md).
  extractor:
    image: "${LOOM_EXTRACTOR_IMAGE_REPOSITORY:-ghcr.io/clickhouse/loom-extractor}:${LOOM_VERSION:-latest}"
    restart: unless-stopped
    environment:
      # Unset, the service refuses to start and says so; the installer writes it.
      LOOM_EXTRACTOR_TOKEN: "${LOOM_DOCUMENT_EXTRACTOR_TOKEN:-}"
    networks: [extractor]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # One extraction at a time (LOOM_EXTRACTOR_CONCURRENCY), each held to
    # LOOM_EXTRACTOR_MEMORY_MB (1 GiB) by its own limit; this bounds the whole.
    mem_limit: 1536m
    cpus: 1
    pids_limit: 64

  # The assistant (`assistant` in COMPOSE_PROFILES): LibreChat runs the agent Loom seeds,
  # headless.
  # Neither it nor its MongoDB publishes a port. The internal `assistant` network
  # joins LibreChat to the loom service alone, and `assistant-db` to its MongoDB
  # alone, so the loom container (which builds repository code) cannot reach that
  # database; LibreChat also has `assistant-egress`, a network of its own, to reach
  # its model provider, so it reaches neither ClickHouse nor the extractor
  # (docs/architecture/assistant.md#deployment).
  librechat:
    profiles: [assistant]
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8@sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    restart: unless-stopped
    depends_on: [librechat-mongo]
    environment:
      # Its secrets and model key, from .env beside this file
      # (docs/features/integrations/librechat.md#the-deployed-assistant).
      CREDS_KEY: "${LIBRECHAT_CREDS_KEY:-}"
      CREDS_IV: "${LIBRECHAT_CREDS_IV:-}"
      JWT_SECRET: "${LIBRECHAT_JWT_SECRET:-}"
      JWT_REFRESH_SECRET: "${LIBRECHAT_JWT_REFRESH_SECRET:-}"
      # A name of its own: the loom service loads all of .env, and an ANTHROPIC_API_KEY
      # there would become Loom's own model key.
      ANTHROPIC_API_KEY: "${LIBRECHAT_ANTHROPIC_API_KEY:-}"
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongo:27017/LibreChat
      CONFIG_PATH: /app/librechat.yaml
      SEARCH: "false"
      ALLOW_REGISTRATION: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      BAN_VIOLATIONS: "false"
    volumes:
      - ./deploy/librechat/assistant.librechat.yaml:/app/librechat.yaml:ro
    networks: [assistant, assistant-db, assistant-egress]

  librechat-mongo:
    profiles: [assistant]
    image: mongo:8.0.20@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    restart: unless-stopped
    command: mongod --noauth --quiet
    volumes:
      - librechat-mongo:/data/db
    networks: [assistant-db]

networks:
  extractor:
    internal: true
  assistant:
    internal: true
  assistant-db:
    internal: true
  assistant-egress: {}

volumes:
  loom-ch-data:
  loom-code-repos:
  librechat-mongo:
