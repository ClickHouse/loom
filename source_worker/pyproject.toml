[project]
name = "loom-source-worker"
version = "0.1.0"
description = "External MCP source worker for Loom."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "anyio>=4",
  "cryptography>=44",
  "dnspython>=2.6",
  "httpx>=0.27",
  "jsonschema>=4.20",
  "mcp>=1.30.0,<2",
  "pydantic>=2.9",
  "pyjwt>=2.10",
  "referencing>=0.37.0",
  "starlette>=0.52",
  "uvicorn>=0.34,<1",
]

[project.scripts]
loom-source-worker = "loom_source_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom_source_worker"]
