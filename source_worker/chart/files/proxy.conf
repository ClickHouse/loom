worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 768;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    client_header_buffer_size 1k;
    large_client_header_buffers 1 31k;
    max_headers 64;
    client_header_timeout 5s;
    client_body_timeout 5s;
    client_max_body_size 1;
    keepalive_timeout 0;
    send_timeout 5s;

    server {
        listen 8443 ssl;
        server_name source-worker-proxy;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/tls/server-chain.pem;
        ssl_certificate_key /etc/nginx/tls/server-key.pem;
        ssl_client_certificate /etc/nginx/tls/client-ca.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_early_data off;
        ssl_session_cache off;
        ssl_session_tickets off;

        error_page 497 = @drop_cleartext;
        add_header Cache-Control no-store always;

        location @drop_cleartext {
            return 444;
        }

        location / {
            if ($request !~ "^POST /v1/(live|check-access) HTTP/1[.]1$") {
                return 404;
            }
            if ($content_length !~ "^0?$") {
                return 400;
            }
            if ($http_transfer_encoding != "") {
                return 400;
            }

            proxy_pass http://unix:/run/loom-source-worker/socket/worker.sock;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host source-worker;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Length "";
            proxy_set_header Transfer-Encoding "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_cache off;
            proxy_store off;
            proxy_ignore_headers X-Accel-Buffering X-Accel-Redirect;
            proxy_hide_header Cache-Control;
            proxy_redirect off;
            proxy_next_upstream off;
            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 35s;
        }
    }
}
