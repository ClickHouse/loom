# yaml-language-server: $schema=schemas/loom-settings.schema.json
#
# Loom settings file: every setting, at its default. Generated from
# server/settings/catalog.py by
# `python scripts/codegen/settings_example.py`; do not edit this copy.
#
# Each key is a setting's LOOM_<NAME> environment variable in lowercase: set any line
# here as LOOM_<NAME> in the environment or in .env, which win over this file. A
# deployment that mounts a config file can instead copy this file (for example to
# loom.yaml), point LOOM_SETTINGS_FILE at it, and uncomment the lines it changes;
# every other setting keeps its default.
#
# A setting marked `live` also changes while Loom runs, deployment-wide and without a
# restart: `loom settings set <name> <value>` or the dashboard's Deployment settings
# page. One marked `restart` is read when a process starts.
#
# Features switch on and off with the settings ending in `_enabled`: search this file
# for "_enabled:". Secrets (passwords, keys, tokens) are not here: they go in the
# environment, .env or a secrets manager (docs/reference/configuration.md lists the
# settings that are secrets, docs/reference/environment.md the provider API keys).
#
# A secret, a key given twice, an unsupported version, or a value of the wrong type
# or outside its bounds stops the server at startup, naming the key. A name no
# setting has is logged and ignored.
version: 1
settings:

  # ===== ClickHouse connection, query shaping and vector storage =====

  # Host name of the ClickHouse server Loom stores everything in. [restart]
  # ch_host: "localhost"

  # ClickHouse HTTP port; 8443 (the Cloud HTTPS port) turns TLS on when `ch_secure` is
  # unset. [restart]
  # ch_port: 8123

  # User name the server connects to ClickHouse as. [restart]
  # ch_user: "loom"

  # The database Loom's schema lives in: every table, view and the migrations ledger,
  # and the connection's default database. Statements are written against `loom` and
  # name this database where they reach ClickHouse (server/core/ch_names.py); KeeperMap
  # paths move with it. Set it before the first migration: while a schema is in `loom`,
  # a server pointed at a name that does not exist, or holds tables but no Loom ledger,
  # refuses to start (create it empty to start a second schema). A letter or `_`, then
  # letters, digits, `_` and `-`; never `default`, `system`, `information_schema`, or a
  # table or alias name the schema uses. Read once at startup. [restart]
  # ch_database: "loom"

  # The database the telemetry Loom derives from its own tables lives in (`sli_minute`),
  # outside the schema so a reader can be granted it alone. A schema outside `loom`
  # names its own: two schemas never share one. [restart]
  # ch_telemetry_database: "loom_telemetry"

  # The cluster `clusterAllReplicas` reads to find a stopped Loom process's queries on
  # every node (`default` on ClickHouse Cloud). A server without it answers for itself;
  # '' reads only the connected server. [restart]
  # ch_cluster: "default"

  # Connect over HTTPS. Unset infers TLS from the port (8443 on, anything else off).
  # [restart]
  # ch_secure: null

  # Append `sql:<shape12> <first 200 chars>` of each statement to its `log_comment`
  # ("<op> <request_id>"), so query_log rows group by shape. A statement that carries a
  # secret, or one run as the analyst, gets its shape alone. Off by default: readers
  # that split log_comment on spaces gain tokens. [restart]
  # ch_log_comment_statement_digest: false

  # A file path: append one JSON line (`digest`, `sql`) per executed statement, to
  # collect the shapes an acceptance run executes for the analyzer corpus. '' = off;
  # never set it in production. [restart]
  # ch_capture_statements: ""

  # HTTP connection pool size: request concurrency plus 3 x the batched-insert bound
  # (inserts a second x wait / 1000; docs/architecture/clickhouse.md#batched-inserts).
  # [restart]
  # ch_pool_maxsize: 64

  # Seconds an idle pooled connection is kept. Must stay BELOW the Cloud load balancer's
  # idle cutoff (8 s) so loom closes first: a peer-closed pooled TLS connection is never
  # reaped under uvloop (`LOOM_UVICORN_LOOP=uvloop`). [restart]
  # ch_keepalive_timeout: 5.0

  # A point lookup that MISSES right after a write (get after set, verify, update_by_id,
  # delete) re-reads once with select_sequential_consistency=1. Costs only on a miss; a
  # no-op on single-node MergeTree. [restart]
  # ch_read_your_writes: true

  # memory.search on a namespace this process wrote within this many seconds reads with
  # select_sequential_consistency from the start. 0 = off (the empty-pool retry remains
  # the backstop). [restart]
  # ch_read_your_writes_window_s: 20.0

  # Deadline, seconds, for read statements, applied as `max_execution_time` and as a
  # client-side bound that frees the pool slot. 0 = no bound for reads. [restart]
  # ch_timeout_read_s: 30.0

  # Deadline, seconds, for INSERT and UPDATE statements; 0 = no bound. [restart]
  # ch_timeout_write_s: 60.0

  # Deadline, seconds, for DDL statements (CREATE, ALTER, DROP); 0 = no bound. [restart]
  # ch_timeout_ddl_s: 300.0

  # Batch the inserts written on every request into shared parts; false commits them,
  # and the waited async inserts keep their bounds
  # (docs/architecture/clickhouse.md#batched-inserts). [live]
  # ch_batched_inserts: true

  # Shortest wait, ms, of a batched or waited async insert: what a lone insert waits
  # when writes are sparse; capped at ch_batched_insert_wait_max_ms (or the background
  # bound). [live]
  # ch_batched_insert_wait_min_ms: 10

  # Longest wait, ms, of a batched or waited async insert a request waits on; it holds a
  # pooled connection meanwhile. [live]
  # ch_batched_insert_wait_max_ms: 50

  # Longest wait, ms, of the usage-event flusher's ticks and shutdown drain and the
  # write-mark timer's flush, which no request waits on. [live]
  # ch_batched_insert_background_wait_max_ms: 200

  # Max wait, ms, for a pool slot before failing fast with 503 OVERLOADED. 0 = no slot
  # gate. [restart]
  # ch_pool_wait_ms: 500

  # Fresh connections a statement tries after a replica-bound error (a replica that lost
  # its Keeper session, a replica's read-only table). Behind a load balancer one
  # reconnect can land on the replica that just failed, so a single retry is not enough.
  # [restart]
  # ch_replica_bound_retries: 2

  # --- caller-shaped read ceilings ---
  # Ceilings for the reads a caller shapes (code.grep, code.search with a pattern or
  # globs, memory.aggregate, memory.record.query). A ceiling only lowers the statement's
  # own value, so no request can widen it; 0 = none. The shipped loom_reader profile
  # (nlp_user_settings.xml) caps these three at their defaults, with a floor no
  # statement can go under (time: 0.05 s, code.grep's statement floor), so none can be
  # set to 0 even in the SQL. Raising a setting above its cap needs the profile raised
  # too; a 0 sends no ceiling, so the profile's cap applies (code.grep's deadline is
  # then clamped to ch_timeout_read_s, which the profile's cap matches).

  # Seconds one caller-shaped read may run (the read class default); 0 = no ceiling, so
  # the loom_reader profile's cap applies. [restart]
  # ch_caller_shaped_max_execution_s: 30.0

  # Bytes of memory one caller-shaped read may use; 0 = no ceiling, so the loom_reader
  # profile's cap applies. [restart]
  # ch_caller_shaped_max_memory_bytes: 4000000000

  # Rows one caller-shaped read may scan; past it the read fails (422), never a partial
  # answer. 0 = no ceiling, so the loom_reader profile's cap applies. [restart]
  # ch_caller_shaped_max_rows_to_read: 500000000

  # ClickHouse user the caller-shaped reads run as, with `ch_password`; the shipped
  # config defines `loom_reader` (SELECT only). Empty = `ch_user`. [restart]
  # ch_reader_user: ""

  # --- analysis statements (insights.query) ---
  # Caps and pacing for insights.query. The statement caps are pinned as a MAX in the
  # loom_analyst user's caps profile so no statement can raise them; a boot whose
  # ClickHouse user has access management writes that profile when one changed.

  # Seconds one insights.query statement may run. [restart]
  # ch_analysis_max_execution_s: 10.0

  # Rows one statement may scan; past it the statement fails (422), never a partial
  # answer. [restart]
  # ch_analysis_max_rows_to_read: 200000000

  # Bytes of memory one statement may use. [restart]
  # ch_analysis_max_memory_bytes: 2000000000

  # Rows one statement returns at most; a longer result comes back cut, marked
  # truncated. [restart]
  # ch_analysis_max_result_rows: 500

  # Bytes of result one statement may return; past it the statement fails (422).
  # [restart]
  # ch_analysis_max_result_bytes: 4000000

  # Statements the analyst user runs at once across every org and replica. [restart]
  # ch_analysis_max_concurrent: 8

  # Threads one statement may use (pinned as a MAX, so a statement cannot take the
  # host). [restart]
  # ch_analysis_max_threads: 4

  # Statements one org runs at once on one replica; past it a call answers RATE_LIMITED.
  # [restart]
  # ch_analysis_max_concurrent_per_org: 2

  # Seconds between two probes of the analyst user in each web process; a problem an
  # admin fixes, or a repair a write makes, shows within one interval. [live]
  # ch_analysis_probe_interval_s: 60.0

  # --- traffic classes ---

  # JSON map {traffic class: ClickHouse settings} applied by
  # `server.core.ch.statement_settings` to every read (an explicit per-call setting
  # wins). `priority`: 1 served first, larger waits, 0 opts out; `max_threads` caps CPU
  # per statement. Neither changes the rows returned. `background` (workers, operator
  # CLIs) bypasses the filesystem cache on a miss so a backfill scan does not evict
  # interactive data. [restart]
  # ch_settings_by_traffic_class: '{"production": {"priority": 1}, "interactive": {"priority": 2}, "bench": {"priority": 10, "max_threads": 4}, "background": {"priority": 5, "max_threads": 3, "read_from_filesystem_cache_if_exists_otherwise_bypass_cache": 1}}'

  # --- migrations ---

  # Apply pending migrations at boot. Set False for any server started from a branch
  # against a shared service, or it applies unmerged migrations. [restart]
  # boot_migrate: true

  # Seconds after which the boot migration lease's holder, once it stops renewing, is
  # replaced. [restart]
  # boot_migrate_lease_ttl_s: 300

  # Seconds a contender waits for the holder before boot fails (exit 1, the container
  # restarts); also how long a booting process waits for the provider configuration lock
  # (a sibling's rebuild step may hold it). [restart]
  # boot_migrate_lease_wait_s: 900.0

  # Seconds a migration file waits for the mutations it started (MATERIALIZE, UPDATE, a
  # column type change) to finish on every replica; past it the file fails unrecorded.
  # [restart]
  # migrate_mutation_wait_s: 600

  # --- vector search ---

  # Send `vector_search_use_quantized_codes = 1` on vector-ranked reads whose column has
  # a `Quantized(...)` codec and whose table has no patch parts: a codes-first scan plus
  # full-precision rescore. A replica that rejects the setting (code 115) drops the
  # fragment and retries. [restart]
  # vector_search_quantized_codes: true

  # Over-fetch for the codes-first read: stage 1 keeps LIMIT × this by code distance,
  # stage 2 rescores. Only read when the codes setting is sent. [restart]
  # vector_search_quantized_fetch_multiplier: 3.0

  # Seconds between re-reads of which vector columns are coded and which coded tables
  # carry patch parts. A write that embeds reads again on its own when the reading is
  # older than a few seconds (codes_state.FRESH_READING_S). [restart]
  # vector_codes_state_probe_seconds: 60

  # --- timeouts, budgets and caches ---

  # Seconds the schema status (applied against shipped migrations) is cached for the
  # health probe. [live]
  # schema_status_ttl_s: 60.0

  # ===== Models: which model does each job =====

  # --- defaults ---

  # The deployment's LLM: memory extraction, rerank and every job whose own model
  # setting (the other *_model settings) is left "". Empty takes the resolved provider's
  # default model (gpt-6-luna / claude-haiku-4-5 / fake-echo-1). [restart]
  # llm_model: ""

  # The assistant agent's model, which LibreChat runs on its own Anthropic key and Loom
  # writes into the agent definition at boot. "" = the definition's own
  # (integrations/librechat/agent.yaml), not llm_model. [restart]
  # assistant_model: ""

  # Model to answer with when a client's provider is still unavailable after its retries
  # (429 / 5xx / transport / timeout) or rejected the request (400 / 413 / 422). Counted
  # in `loom.llm.fallback`. 401 / 403 / 404 are configuration and never fall back. "" =
  # fail the op. [restart]
  # llm_fallback_model: ""

  # Embeddings for memories, queries and code chunks. fake-ngram-3072 needs no network
  # or key; production uses text-embedding-3-* (OPENAI_API_KEY). Change it together with
  # `embedding_dim`; a new embedding space needs a full re-embed. [restart]
  # embedding_model: "fake-ngram-3072"

  # Where `local` models live (relative: under the working directory), one directory per
  # alias and revision; a missing file is fetched there. The image sets it by env.
  # [restart]
  # local_embedding_model_dir: "var/models"

  # --- memory ---

  # memory.ask synthesis (the strong tier when the cascade is on). [restart]
  # memory_ask_synth_model: ""

  # memory.ask cheap tier. "" = off: every ask uses memory_ask_synth_model. When set,
  # server/memory/domain/synth_policy.py routes easy asks cheap and hard ones strong; an
  # empty, uncited or hedging cheap answer escalates to strong once. route_tier /
  # route_reason / synth_model on the output record the choice. [restart]
  # memory_ask_synth_model_cheap: ""

  # memory.ask mid tier. "" = none. With a model set, strong-routed asks whose reason is
  # in memory_ask_synth_mid_routes go mid; an empty, uncited or hedging mid answer
  # escalates to strong once. [restart]
  # memory_ask_mid_model: ""

  # The durability check on a coding capture: one batched call per capture per listed
  # model (CSV) judges each fact durable or not and folds same-claim paraphrases and
  # replaced states. A fact is dropped only when every model says drop; folds come from
  # the first. Fails open. "" turns it off. [restart]
  # memory_extract_verify_models: "claude-opus-5-5"

  # The conflict resolver's judge (memory_conflict_resolver_enabled). Its confidence
  # thresholds were set on this model; a cheaper one is only safe for clears. [restart]
  # conflict_resolver_model: "gpt-6.1-sol"

  # Model of the profile fold, which consolidates an identity's memories into its
  # profile; "" = `llm_model`. [restart]
  # profile_consolidation_model: ""

  # Model of the structured profile builder, which fills a user's profile in the
  # namespace's schema; "" = `llm_model`. [restart]
  # structured_profile_model: ""

  # Reflection distillation: the outcome labeller and the contrast writer. [restart]
  # reflection_distill_model: ""

  # The code-link `revise` judge: does a memory's claim still hold for its code's new
  # text. [restart]
  # code_link_revise_model: ""

  # Session briefs; without its provider's key the deployment's LLM writes them.
  # [restart]
  # session_brief_llm_model: "gpt-6-luna"

  # --- code ---

  # code.ask synthesis. Answers are memoized fleet-wide, so a stronger model costs once
  # per unique question. [restart]
  # code_ask_llm_model: ""

  # code.search HyDE: writes a hypothetical indexed passage whose embedding runs a
  # second vector list (see code_search_hyde_*). "" = off. [restart]
  # code_search_hyde_model: ""

  # code.search concept expansion: maps a prose, unconstrained question to likely code
  # identifiers — via this model, or `cards` / `cards:<n>` (symbols of the n nearest
  # file cards) — fused as a capped lexical list. "" = off. [restart]
  # code_search_concept_expand_model: ""

  # code.bisect_candidates' one-call rerank of the fused top 20. [restart]
  # code_bisect_llm_rerank_model: "gpt-6-luna"

  # File and module summary cards. [restart]
  # code_summary_model: ""

  # --- tracker ---

  # tracker.duplicate_check's rerank call. [restart]
  # tracker_dupcheck_rerank_model: "gpt-6-luna"

  # tracker.duplicate_check's judge call. [restart]
  # tracker_dupcheck_judge_model: ""

  # --- observability ---

  # The sampled retrieval judge (retrieval_judge_sample_rate). Deliberately a different
  # model from the ones answering: a same-model judge measures agreement, not quality.
  # [restart]
  # retrieval_judge_model: "gpt-6.1-sol"

  # ===== Embedding and LLM providers =====

  # Vector width the embedder is asked for and the schema is sized from; the width
  # probed from the embedder at boot wins when they differ. Change it together with
  # `embedding_model`. Unset with a `local:*` model, it is that model's own width: leave
  # it unset for a local model. [restart]
  # embedding_dim: 3072

  # "" = infer from `embedding_model` (fake-ngram-* → fake, text-embedding-* → openai,
  # gemini* → gemini, local/local:* → local CPU embedder); or pin "openai", "gemini",
  # "local", "fake". Switching providers changes the embedding space: a full re-embed is
  # required. [restart]
  # embedding_provider: ""

  # API root for an explicitly selected OpenAI-compatible embedding service, e.g.
  # https://provider.example/v1. Empty is invalid for compatible providers. [restart]
  # embedding_base_url: ""

  # Send the optional dimensions request parameter to a compatible endpoint. False uses
  # its native output width; responses must still match embedding_dim. [restart]
  # embedding_send_dimensions: false

  # Attempts an embedding call makes on a retryable failure. [live]
  # embedding_retry_attempts: 3

  # Longest backoff, in seconds, between two attempts of an embedding call. [live]
  # embedding_retry_max_wait_s: 10.0

  # OpenAI's API root, for chat and embeddings: point it at an OpenAI-compatible
  # inference gateway in front of OpenAI (its /v1 root). [restart]
  # openai_base_url: "https://api.openai.com/v1"

  # Anthropic's API root (the Messages API is <root>/v1/messages): point it at a gateway
  # in front of Anthropic. Off the default, the key also goes as a bearer, the scheme
  # gateways take. [restart]
  # anthropic_base_url: "https://api.anthropic.com"

  # Model calls with no provider key: exchange an identity token (RFC 8693) at this
  # token endpoint of the gateway, and send the answer as the bearer
  # (server/llm/gateway.py). The gateway must trust the token's issuer. "" = the
  # provider keys. [restart]
  # inference_token_url: ""

  # The workload's OIDC token, as a file its platform rotates (a projected
  # service-account token on Kubernetes). With inference_token_url, this or
  # inference_token_audience. [restart]
  # inference_workload_token_file: ""

  # How inference_workload_token_file reaches the gateway: "exchange" (RFC 8693, at
  # inference_token_url) or "bearer" (the file itself, read again at most every minute
  # and after a 401; requires the gateway). [restart]
  # inference_workload_token_mode: "exchange"

  # With inference_token_url and no workload token: the audience of the identity token
  # Loom signs (issuer <https public_base_url>/v1, newest RS256 key); never
  # jwt_audience. [restart]
  # inference_token_audience: ""

  # The scope sent with the inference gateway token exchange; "" sends none. [restart]
  # inference_token_scope: ""

  # Seconds one token exchange with the inference gateway may take. [restart]
  # inference_token_exchange_timeout_s: 10.0

  # Seconds a provider check (the dashboard's Models & keys validate and save) waits for
  # its probe call before it reports `timeout`. [live]
  # provider_check_timeout_s: 30.0

  # True: model calls and memory content go only to inference_gateway_hosts; on whenever
  # a workload token is sent (inference_token_url, or the bearer mode). [restart]
  # inference_gateway_required: false

  # Comma-separated hostnames (exact, any case) of the gateway; required, and the only
  # hosts sent to, while the gateway is required. [restart]
  # inference_gateway_hosts: ""

  # Header naming the customer (the org) on every model call, for a gateway that meters
  # by it; set, a call naming no customer is refused (server/llm/customer.py). [restart]
  # inference_customer_header: ""

  # Header naming the feature that made the call (hyde, memory.search, worker.embedding,
  # ...), with inference_customer_header only; "" sends none. [restart]
  # inference_feature_header: ""

  # The customer named on calls made for the deployment itself (startup probe, the
  # recalibration worker's fixed pairs, provider checks), which belong to no org.
  # [restart]
  # inference_system_customer: "loom"

  # True (a cell serving several customers): refuse to start without
  # inference_customer_header, so no model call goes out unattributed. [restart]
  # inference_customer_required: false

  # How the customer header names an org, as the gateway knows it: `{org}` is the org
  # id, around it letters, digits and . _ ~ : @ - only ("{org}" = the id as is).
  # [restart]
  # inference_customer_format: "{org}"

  # JSON object from Loom's feature names (hyde, memory.search, worker.embedding, ...)
  # to the gateway's (letters, digits, . _ ~ : @ -); "*" for any other; "" = Loom's.
  # [restart]
  # inference_feature_map_json: ""

  # JSON object {header: template} every model call carries, naming whom it is for:
  # {org} {namespace} {subject} {user_id}, {agent} (of a workload trust's agent token),
  # {tenant} (that trust's inference_tenant_claim) and {email} (a person's). A header
  # whose template renders empty is not sent, and those naming {agent} or {tenant} go
  # together or not at all; set, a call naming no org is refused. "" sends none
  # (server/llm/identity.py). [restart]
  # inference_identity_headers_json: ""

  # The workload trust claim {tenant} names: the value the trust requires of it,
  # exactly. [restart]
  # inference_tenant_claim: "tenant_id"

  # JSON object of the gateway answers that hold one identity, not the provider:
  # {"refused": [...], "wait": [...]}, each entry {"status": <int>} and at least one of
  # the error body's exact "code", "type" or "message". A refused identity's job work
  # waits inference_refusal_cooldown_seconds, a waiting one the answer's Retry-After.
  # The default: an agent over its budget (by code, and by type and message where the
  # Anthropic-shaped answer carries no code), denied, or named incompletely or
  # malformed; too many of its requests in progress waits. Never list an answer the
  # gateway also gives for its own failure (a credential it cannot fetch, no default
  # agent): health would stop seeing it. Read only with identity headers set
  # (server/llm/gateway.py). [restart]
  # inference_identity_refusals_json: '{"refused": [{"status": 429, "code": "budget_exceeded"}, {"status": 429, "type": "rate_limit_error", "message": "budget exceeded"}, {"status": 403, "code": "agent_denied"}, {"status": 400, "code": "identity_incomplete"}, {"status": 400, "code": "identity_malformed"}], "wait": [{"status": 429, "code": "agent_request_limit"}]}'

  # Seconds a background job leaves the work of an identity the gateway refused (an
  # answer listed under "refused") before it calls for it again; 0 calls again at once.
  # [restart]
  # inference_refusal_cooldown_seconds: 600.0

  # Seconds between each process's reads of the orgs whose model calls are switched off
  # (loom.org_model_calls) and of the operators' extraction policies
  # (loom.extraction_policies); a change reaches every process within it. [restart]
  # model_calls_policy_refresh_seconds: 10.0

  # Seconds a process trusts its copy of the org model-call switch, and of the
  # extraction policies, when it cannot read it again; past it, every model call for an
  # org is refused and no extraction runs (fail closed). 15 to 300. [restart]
  # model_calls_policy_max_stale_seconds: 60.0

  # Days a switched-off org's queued requests (the extraction queue) wait, from when the
  # org was switched off, before they are dropped, each with a memory_drops record. 1 to
  # 29: the queue's own 30-day TTL would otherwise remove them first, with no record.
  # [restart]
  # model_calls_off_max_wait_days: 7

  # Waiting requests of a switched-off org one extraction-queue pass drops; the rest go
  # on the next pass. [restart]
  # model_calls_off_drop_per_pass: 500

  # Shared query-embedding cache in loom.embedding_cache behind the per-process LRU,
  # rows keyed (model, sha1(org, model, version salt, normalised text)); a call outside
  # a request skips both tiers. Only single-text (query) embeds up to
  # `embedding_cache_shared_max_chars` (0 = no cap) use it. Off = process cache only.
  # [restart]
  # embedding_cache_shared: true

  # Longest query text, characters, that uses the shared cache; 0 = no cap. [restart]
  # embedding_cache_shared_max_chars: 2000

  # Entries the per-process query-embedding LRU holds; 0 = cache nothing. [restart]
  # embedding_cache_size: 10000

  # Seconds one per-process LRU entry lives. [restart]
  # embedding_cache_ttl_s: 3600.0

  # Derive the similarity gates from this embedder's cosine distribution at boot
  # (server/memory/app/embedder_calibration.py). False pins the scalar defaults (tuned
  # for text-embedding-3-small) — re-bench after an embedder change. Fake embedders and
  # probe failures always use the scalars. [restart]
  # adaptive_thresholds: true

  # Seconds between each replica's re-read of the shared calibration
  # (loom.embedder_calibration), so every replica serves the same gates. [restart]
