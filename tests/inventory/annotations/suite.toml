# Inventory annotations for the suite area: the tests/ root, the inventory
# itself, the unit conftest and the shared unit helpers.

[[files]]
match = "tests/__init__.py"
owner = "test suite"
status = "retain"
notes = "Empty package marker; `tests.inventory` and `tests.unit.*` import through it."

[[files]]
match = "tests/conftest.py"
owner = "integration fixtures"
status = "retain"
notes = "Integration and analyzer fixtures; the unit conftest shadows the .env loader and the token seeding."

[[files]]
match = "tests/README.md"
owner = "test suite"
status = "retain"

[[files]]
match = "tests/inventory/*"
owner = "test inventory and feature ledger"
status = "retain"

[[files]]
match = "tests/unit/conftest.py"
owner = "unit isolation guards"
status = "retain"
tags = ["security"]
notes = "Autouse guards: settings, auth principal, query tag, env/cwd/threads, module caches, pending tasks."

[[files]]
match = "tests/unit/test_test_inventory.py"
owner = "test inventory and feature ledger"
status = "retain"
tags = ["negative"]

[[files]]
match = "tests/unit/ch_fake.py"
owner = "shared unit fakes"
status = "retain"

[[files]]
match = "tests/unit/llm_fake.py"
