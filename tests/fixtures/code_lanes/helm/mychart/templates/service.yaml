{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "mychart.fullname" . }}
  labels: {{ include "mychart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{ include "mychart.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mychart.fullname" . }}-sa
{{- end }}
