# The local stack from a clone: compose.yaml with the bundled ClickHouse, Loom
# built from this checkout, and development defaults.
#
#   make dev        (or `loom up`), which runs
#   docker compose --env-file .env -f compose.yaml -f dev/docker-compose.dev.yml \
#     --profile bundled up -d --build
#
# Paths resolve from the repository root, the directory of compose.yaml.
# For Loom built from source against your own ClickHouse, use `make dev-cloud`.

# The compose project, and so its volume names, unless .env names one.
name: dev

services:
  clickhouse:
    # Pull the latest release again on the first `up` of a day (Compose 2.34 or
    # later), so a cached image does not hold an older one.
    pull_policy: daily
    container_name: loom-ch
    # Host-side ports for `make server` and ad-hoc queries; remap in .env when
    # 8123/9000 are taken. Containers always use clickhouse:8123.
    ports:
      - "${LOOM_BIND_HOST:-127.0.0.1}:${LOOM_CH_HOST_PORT:-8123}:8123"
      - "${LOOM_BIND_HOST:-127.0.0.1}:${LOOM_CH_NATIVE_HOST_PORT:-9000}:9000"

  loom:
    image: loom:dev
    build:
      context: .
      dockerfile: Dockerfile
      # fastembed is installed only when LOOM_EMBEDDING_MODEL is local (see Dockerfile).
      args:
        LOOM_EMBEDDING_MODEL: "${LOOM_EMBEDDING_MODEL:-}"
        LOOM_BUILD_COMMIT: "${LOOM_BUILD_COMMIT:-unknown}"
    container_name: loom-server
    environment:
      # A checkout's .env also serves `make server` on the host, where
      # LOOM_CH_HOST is localhost: the container always uses the bundled server.
      LOOM_CH_HOST: clickhouse
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_READER_USER: loom_reader
      LOOM_CH_SECURE: "false"
      # Trust-network (self-signup) by default. For a no-login local box, set
      # LOOM_IDENTITY_PROVIDER=single-user in .env: that disables auth whatever
      # LOOM_AUTH_REQUIRED says (Settings.auth_actually_required).
      LOOM_AUTH_REQUIRED: "${LOOM_AUTH_REQUIRED:-true}"
      LOOM_IDENTITY_PROVIDER: "${LOOM_IDENTITY_PROVIDER:-}"
      LOOM_DEFAULT_NAMESPACE: "${LOOM_DEFAULT_NAMESPACE:-local}"
      # OAuth 2.1 one-click MCP connect, off by default. LOOM_OAUTH_ISSUER is the
      # public HTTPS base URL the discovery metadata advertises.
      LOOM_OAUTH_ENABLED: "${LOOM_OAUTH_ENABLED:-false}"
      LOOM_OAUTH_ISSUER: "${LOOM_OAUTH_ISSUER:-}"
      LOOM_TRUSTED_CALLERS: "gateway"
      # `loom up`/`make bootstrap` generate this in the private .env. Refuse
      # to start auth with a repository-wide signing key or an empty secret.
      LOOM_JWT_SECRET: "${LOOM_JWT_SECRET:?run 'loom up' or set LOOM_JWT_SECRET in .env}"
      # The extractor service below; .env holds the token both read.
      LOOM_DOCUMENT_EXTRACTOR_URL: "http://extractor:8790"
      # Retrieval flags passed through for single-variable bench A/B runs.
      LOOM_MEMORY_EMBED_ANSWER_TOPIC: "${LOOM_MEMORY_EMBED_ANSWER_TOPIC:-true}"
      LOOM_MEMORY_CAPTURE_STRUCTURED_ANSWERS: "${LOOM_MEMORY_CAPTURE_STRUCTURED_ANSWERS:-true}"
      LOOM_ENTITY_EXTRACT_ENABLED: "${LOOM_ENTITY_EXTRACT_ENABLED:-true}"
      # Browser self-signup so the dashboard's Welcome screen can mint tokens. A
      # trusted-network assumption: never on an externally reachable stack.
      LOOM_SELF_SIGNUP: "open"
      # Marks this stack's rows and lets it run with the development defaults.
      LOOM_INSTANCE_LABEL: "deploy:dev"
      # Self-service repositories make progress in the stock stack; these
      # workers idle until a repository is added and need no LLM.
      LOOM_CODE_INGEST_ENABLED: "${LOOM_CODE_INGEST_ENABLED:-true}"
      LOOM_CODE_EMBED_RECOVERY_ENABLED: "${LOOM_CODE_EMBED_RECOVERY_ENABLED:-true}"
      LOOM_CODE_GRAPH_STATS_ENABLED: "${LOOM_CODE_GRAPH_STATS_ENABLED:-true}"
      LOOM_CODE_SCIP_DELTA_ENABLED: "${LOOM_CODE_SCIP_DELTA_ENABLED:-true}"
      LOOM_CODE_SCIP_TS_DELTA_ENABLED: "${LOOM_CODE_SCIP_TS_DELTA_ENABLED:-true}"
      LOOM_CODE_SCIP_PY_DELTA_ENABLED: "${LOOM_CODE_SCIP_PY_DELTA_ENABLED:-true}"
      LOOM_CODE_SCIP_GO_DELTA_ENABLED: "${LOOM_CODE_SCIP_GO_DELTA_ENABLED:-true}"
      LOOM_MCP_CODE_TOOLS: "${LOOM_MCP_CODE_TOOLS:-true}"

  extractor:
    image: loom-extractor:dev
    build:
      context: .
      dockerfile: extractor/Dockerfile
    container_name: loom-extractor
