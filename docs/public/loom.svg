<svg class="loom-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Loom">
  <rect class="loom-logo-background" width="40" height="40" rx="9" fill="transparent"/>
  <g class="loom-logo-mark" stroke="#1d1d1d" stroke-width="2.2" stroke-linecap="round">
    <line x1="20" y1="20" x2="20" y2="6"/>
    <line x1="20" y1="20" x2="34" y2="20"/>
    <line x1="20" y1="20" x2="20" y2="34"/>
    <line x1="20" y1="20" x2="6" y2="20"/>
  </g>
  <g class="loom-logo-mark" fill="#1d1d1d">
    <circle cx="20" cy="6" r="3"/>
    <circle cx="34" cy="20" r="3"/>
    <circle cx="20" cy="34" r="3"/>
    <circle cx="6" cy="20" r="3"/>
    <circle cx="20" cy="20" r="6"/>
  </g>
  <circle class="loom-logo-cutout" cx="20" cy="20" r="2.4" fill="#ffffff"/>
</svg>
