# Loom host proxy: the listener that outlives a redeploy.
#
# nginx holds host :7777 and forwards to whichever colour `upstream.conf`
# names (`loom-blue:7781` or `loom-green:7782`, two compose projects on the
# `loom-net` network). `redeploy.sh` rewrites that file and runs
# `nginx -s reload`: the master re-reads the config, starts new workers that
# inherit the listening socket, and the old workers finish their in-flight
# requests and exit — no connection is refused, no port is rebound.
#
# The upstream file is mounted from the host (`var/proxy/`, gitignored) so
# the swap is a file write, not an image or a container change. Only the
# active colour is named: nginx resolves upstream hostnames at (re)load, and
# an idle colour that is not running would fail the reload.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  # loom's own request ledger (loom.agent_events) is the access log.
  access_log off;

  include /etc/nginx/upstream/upstream.conf;

  # This listener speaks plain HTTP behind a TLS terminator
  # (a TLS proxy, a load balancer). Forward the client-facing scheme the
  # terminator already stated; fall back to our own only when nothing did.
  # Overwriting it with $scheme would hand every client an http:// URL.
  map $http_x_forwarded_proto $loom_forwarded_proto {
    default $scheme;
    "~." $http_x_forwarded_proto;
  }

  server {
    listen 7777 backlog=2048;
    # Above LOOM_MAX_REQUEST_BYTES (32 MiB by default), so loom's own JSON 413
    # answers an oversized memory.bulk_set; nginx only stops the extreme.
    client_max_body_size 64m;

    location / {
      proxy_pass http://loom;
      # Keep-alive to the colour: one upstream connection per client
      # connection, reused (the `keepalive` pool in upstream.conf).
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # The peer address replaces any client-sent chain: this listener cannot
      # tell a terminator's hop from a caller's forged one, and uvicorn
      # (--forwarded-allow-ips='*') would take the first entry as the client.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $loom_forwarded_proto;
      # A memory.ask can run for minutes on the strong tier; the SDK's own
      # timeout is the client's bound, not this.
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 5s;
      # Stream responses as loom writes them (SSE on /v1/task/watch, long asks).
      proxy_buffering off;
      # Never replay a POST on another upstream: the colours are not a pool,
      # and loom's operations carry their own idempotency.
      proxy_next_upstream off;
    }
  }
}
