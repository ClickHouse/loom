# nginx in front of N identical Loom replicas (dev/docker-compose.replicas.yml).
#
# Passive checks only: open-source nginx never reads /v1/health/ready, and
# the compose healthcheck does not take a replica out of this upstream. A
# replica that is up but not ready (keys not loaded, config drift, warm-up)
# gets traffic, and a draining one gets it until its port closes. nginx only
# retries a refused connect on another replica (`proxy_next_upstream error`)
# and leaves the failed one out for `fail_timeout`. Route production traffic
# through a balancer that probes /v1/health/ready (a Kubernetes readiness
# probe, HAProxy, Envoy, a cloud LB target group; docs/operations/deployment.md).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  access_log off;
  # Docker's DNS: a replica that is recreated comes back under a new address.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream loom {
    zone loom 64k;
    server loom-1:7777 resolve max_fails=1 fail_timeout=5s;
    server loom-2:7777 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
  }

  map $http_x_forwarded_proto $loom_forwarded_proto {
    default $scheme;
    "~." $http_x_forwarded_proto;
  }

  server {
    listen 7777 backlog=2048;
    client_max_body_size 64m;

    location / {
      proxy_pass http://loom;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $loom_forwarded_proto;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 5s;
      proxy_buffering off;
      # Only a failed connect or send is retried: nginx never replays a POST
      # a replica already received.
      proxy_next_upstream error;
      proxy_next_upstream_tries 2;
    }
  }
}
