{{- $guard := .Values.networkPolicy.guardMetadata }}
{{- if not (or (kindIs "invalid" $guard) (kindIs "bool" $guard)) }}
{{- fail "networkPolicy.guardMetadata must be true or false" }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" . }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        # helm test.
        - podSelector:
            matchLabels:
              {{- include "loom.selectorLabels" $ | nindent 14 }}
      {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        # NodeLocal DNSCache's default address.
        - ipBlock: { cidr: 169.254.20.10/32 }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # helm test reaches the web pods.
    - to:
        - podSelector:
            matchLabels:
              {{- include "loom.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - port: http
    {{- if .Values.extractor.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "loom.extractorSelectorLabels" . | nindent 14 }}
      ports:
        - port: 8790
    {{- end }}
    {{- if .Values.devClickhouse.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "loom.chHost" . }}
      ports:
        - port: 8123
    {{- end }}
    - to:
        {{- include "loom.anywhereBut" . | nindent 8 }}
      ports:
        - port: 443
        {{- if .Values.retireLostPods }}
        # The Kubernetes API (443 on EKS; 6443 on most other clusters).
        - port: 6443
        {{- end }}
        {{- if and (not .Values.devClickhouse.enabled) (ne (int .Values.clickhouse.port) 443) }}
        - port: {{ .Values.clickhouse.port }}
        {{- end }}
    # The EKS Pod Identity agent, which hands out this service account's credentials.
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }
        - ipBlock: { cidr: fd00:ec2::23/128 }
      ports:
        - port: 80
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- else if and (ne $guard false) .Values.networkPolicy.egressExcept }}
{{- /* Off: every pod and every address but `egressExcept`; pods are named apart
because engines differ on whether an ipBlock matches pod IPs. A missing
`guardMetadata` counts as on: `helm upgrade --reuse-values` keeps the old values. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "loom.fullname" . }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
        {{- include "loom.anywhereBut" . | nindent 8 }}
{{- end }}
