{{- /* `loom export-analytics` once a day, under a service account of its own:
the bucket's write role is bound to it alone, never to the web pods'. A second
run of a day keeps the first run's files, so a retry is safe. */}}
{{- with .Values.analyticsExport }}
{{- if .enabled }}
{{- if not .bucket }}
{{- fail "analyticsExport.enabled needs analyticsExport.bucket" }}
{{- end }}
{{- if not (kindIs "string" .expectedBucketOwner) }}
{{- fail "analyticsExport.expectedBucketOwner must be a quoted string: an unquoted account id renders as a float" }}
{{- end }}
{{- if not (has .names (list "hashed" "raw")) }}
{{- fail "analyticsExport.names must be hashed or raw" }}
{{- end }}
{{- if and (eq .names "hashed") (not .nameKeySecret.name) }}
{{- fail "analyticsExport.names: hashed needs analyticsExport.nameKeySecret.name, the Secret holding the hash key" }}
{{- end }}
{{- $name := include "loom.suffixed" (dict "root" $ "suffix" "analytics-export") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "loom.labels" $ | nindent 4 }}
  {{- with .serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "loom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: analytics-export
spec:
  schedule: {{ .schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      # Exit 2 is a refusal (a day not ended, a missing key, raw names with
      # self-signup open): a retry would refuse the same way.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: analytics-export
              operator: In
              values: [2]
      template:
        metadata:
          labels:
            {{- include "loom.labels" $ | nindent 12 }}
            app.kubernetes.io/component: analytics-export
            {{- with $.Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $.Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- include "loom.podCommon" (dict "root" $ "leads" false "serviceAccount" $name) | nindent 10 }}
          {{- with $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "loom.waitForDevClickhouse" $ | nindent 10 }}
          containers:
            - name: analytics-export
              image: {{ include "loom.image" $ }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command:
                - loom
                - export-analytics
                - {{ printf "--bucket=%s" .bucket | quote }}
                - {{ printf "--names=%s" .names | quote }}
                {{- with .prefix }}
                - {{ printf "--prefix=%s" . | quote }}
                {{- end }}
                {{- with .roleArn }}
                - {{ printf "--role-arn=%s" . | quote }}
                {{- end }}
                {{- with .region }}
                - {{ printf "--region=%s" . | quote }}
                {{- end }}
                {{- with .expectedBucketOwner }}
                - {{ printf "--expected-bucket-owner=%s" . | quote }}
                {{- end }}
              envFrom:
                - secretRef:
                    name: {{ include "loom.secretName" $ }}
                {{- with $.Values.envFrom }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              env:
                {{- range $k, $v := fromYaml (include "loom.config" $) }}
                - name: {{ $k }}
                  value: {{ $v | toString | quote }}
                {{- end }}
                - name: POD_NAME
                  valueFrom: { fieldRef: { fieldPath: metadata.name } }
                - name: POD_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: LOOM_INSTANCE_LABEL
                  value: k8s:analytics-export
                {{- if eq .names "hashed" }}
                - name: LOOM_ANALYTICS_EXPORT_NAME_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .nameKeySecret.name }}
                      key: {{ .nameKeySecret.key }}
                {{- end }}
                {{- with $.Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .resources | nindent 16 }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: cache
                  mountPath: /app/var
                {{- with $.Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
            {{- with $.Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
{{- end }}
