{{- range $k, $_ := .Values.settingsFile }}
{{- if has $k (list "embedding_provider" "embedding_model" "embedding_dim" "embedding_base_url" "embedding_send_dimensions" "jwt_secret" "jwt_secret_previous") }}
{{- fail (printf "set %s through %s, not settingsFile" $k (include "loom.guardedThrough" (dict "key" $k "root" $))) }}
{{- end }}
{{- end }}
{{- /* Rendered and mounted even when empty: a pod of the previous ReplicaSet started
during a rollout still names this ConfigMap and LOOM_SETTINGS_FILE. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loom.suffixed" (dict "root" . "suffix" "settings") }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
data:
  loom.yaml: |
    # yaml-language-server: $schema=https://raw.githubusercontent.com/ClickHouse/loom/main/schemas/loom-settings.schema.json
    {{- dict "version" 1 "settings" (.Values.settingsFile | default dict) | toYaml | nindent 4 }}
