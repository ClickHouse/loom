{{- if .Values.workers.enabled }}
{{- /* Background workers apart from the web pods: no Service routes here, the
pods elect one leader among themselves and run its passes inline. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loom.fullname" . }}-workers
  labels:
    {{- include "loom.labels" . | nindent 4 }}
    app.kubernetes.io/component: workers
spec:
  replicas: {{ .Values.workers.replicaCount }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: {{ add (mul .Values.probes.startup.periodSeconds .Values.probes.startup.failureThreshold) 300 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ ternary "100%" 1 (eq (include "loom.publishing" .) "true") }}
  selector:
    matchLabels:
      {{- include "loom.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: workers
  template:
    metadata:
      labels:
        {{- include "loom.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: workers
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: loom
        {{- with include "loom.publishedToken" . }}
        loom.clickhouse.com/published: {{ . | quote }}
        {{- end }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include "loom.secretChecksum" . }}
        {{- end }}
        checksum/settings-file: {{ include "loom.settingsFileChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "loom.podCommon" (dict "root" . "leads" true) | nindent 6 }}
      {{- if .Values.topologySpread.enabled }}
      # Leader and standby on different nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "loom.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: workers
          matchLabelKeys: [pod-template-hash]
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "loom.waitForDevClickhouse" . | nindent 6 }}
      containers:
        {{- include "loom.container" (dict "root" . "serves" false "resources" .Values.workers.resources "resourcesPath" "workers.resources") | nindent 8 }}
      volumes:
        {{- include "loom.volumes" (dict "root" . "workers" true) | nindent 8 }}
{{- end }}
