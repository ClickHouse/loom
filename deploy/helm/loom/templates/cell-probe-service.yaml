{{- $port := include "loom.cellProbePort" . -}}
{{- if ne $port "0" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loom.suffixed" (dict "root" . "suffix" "cell-probe") }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - name: cell-probe
      port: {{ $port }}
      targetPort: cell-probe
      protocol: TCP
  selector:
    {{- include "loom.selectorLabels" . | nindent 4 }}
    loom.clickhouse.com/cell-probe: "true"
{{- end }}
