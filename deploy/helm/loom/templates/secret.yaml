{{- if not .Values.secrets.existingSecret }}
{{- $jwt := required "secrets.jwtSecret is required (or secrets.existingSecret): the root secret every pod shares" .Values.secrets.jwtSecret }}
{{- if lt (len $jwt) 32 }}
{{- fail "secrets.jwtSecret must be at least 32 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loom.fullname" . }}
  labels:
    {{- include "loom.labels" . | nindent 4 }}
type: Opaque
# `data`, not `stringData`: the API keeps only `data`, so a key removed from
# these values would stay in a Secret patched through `stringData`.
data:
  LOOM_JWT_SECRET: {{ $jwt | b64enc | quote }}
  {{- with .Values.secrets.jwtSecretPrevious }}
  LOOM_JWT_SECRET_PREVIOUS: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.devClickhouse.enabled }}
  LOOM_CH_PASSWORD: {{ .Values.devClickhouse.password | b64enc | quote }}
  {{- else if .Values.secrets.clickhousePassword }}
  LOOM_CH_PASSWORD: {{ .Values.secrets.clickhousePassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.extractor.enabled }}
  {{- if hasKey .Values.secrets.extra "LOOM_DOCUMENT_EXTRACTOR_TOKEN" }}
  {{- fail "set LOOM_DOCUMENT_EXTRACTOR_TOKEN through secrets.extractorToken, not secrets.extra" }}
  {{- end }}
  {{- $token := required "extractor.enabled needs secrets.extractorToken (or the key LOOM_DOCUMENT_EXTRACTOR_TOKEN in secrets.existingSecret)" .Values.secrets.extractorToken }}
  {{- if lt (len $token) 16 }}
  {{- fail "secrets.extractorToken must be at least 16 characters" }}
  {{- end }}
  LOOM_DOCUMENT_EXTRACTOR_TOKEN: {{ $token | b64enc | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
