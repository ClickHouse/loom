# Loom on Kubernetes. Every pod is a full replica over one ClickHouse service:
# docs/operations/kubernetes.md. Values-eks.yaml and values-kind.yaml layer on this, and
# values-clickhouse-cloud.yaml on values-eks.yaml.

image:
  repository: ghcr.io/clickhouse/loom
  # Defaults to the chart's appVersion. Pin a version or digest in production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 3

# Public URL clients reach Loom on (LOOM_PUBLIC_BASE_URL). Required: a pod that
# listens on every interface refuses to start without it.
publicBaseUrl: ""

clickhouse:
  # One ClickHouse service for every pod (Cloud, or a self-managed server with
  # Keeper). On a self-managed replicated cluster point every pod at one replica.
  # The schema lives in a database named `loom`, which must exist.
  host: ""
  port: 8443
  secure: true
  user: loom
  # Read-only user for caller-shaped reads (LOOM_CH_READER_USER); "" = none.
  readerUser: ""
  # LOOM_CH_CLUSTER: the cluster clusterAllReplicas reads ("default" on Cloud).
  cluster: default

# An external Postgres as the memory authority (docs/operations/postgres.md). With
# `host` set the chart sets LOOM_STORAGE_AUTHORITY=postgres and connects over
# verify-full; the authority is chosen at first boot, so start on an empty ClickHouse.
postgres:
  # The direct endpoint, never a transaction pooler. "" = the ClickHouse authority.
  host: ""
  port: 5432
  database: loom
  # A role that owns the database. The host, database and user go into the DSN as
  # written: letters, digits, '.', '_' and '-' only.
  user: loom
  # The Secret key holding the role's password, passed to the driver as PGPASSWORD.
  passwordSecret:
    name: ""
    key: password
  # The Secret key holding the PEM bundle of every root the service's CA publishes,
  # mounted at /etc/loom/pg-ca.
  caSecret:
    name: ""
    key: ca.crt
  # LOOM_PG_DURABILITY: synchronous refuses to start when the server's
  # synchronous_standby_names is empty.
  durability: synchronous
  # LOOM_PG_POOL_MAX_SIZE: connections per Loom process, at least LOOM_PG_POOL_MIN_SIZE
  # (2 by default); a smaller pool fails at boot.
  poolMaxSize: 20

embedding:
  # Must match on every pod and cannot roll (see mustMatchChange below).
  # text-embedding-3-* needs OPENAI_API_KEY in secrets.extra; fake-ngram-3072
  # needs nothing and is for tests only.
  provider: ""
  model: text-embedding-3-large
  dim: 3072
  baseUrl: ""
  sendDimensions: false

llm:
  provider: ""
  model: ""

# Secrets. Either the chart creates one Secret from these values, or name an
# existing Secret (External Secrets Operator, Sealed Secrets, ...) holding the
# same keys: LOOM_JWT_SECRET, LOOM_CH_PASSWORD and any provider key.
secrets:
  existingSecret: ""
  jwtSecret: ""
  # The root secret jwtSecret replaced, while a rotation is under way
  # (LOOM_JWT_SECRET_PREVIOUS): what it sealed still opens (it verifies no
  # token). A post-upgrade Job reseals the stored values under jwtSecret; remove
  # it once `loom secrets reseal --check` exits 0. With existingSecret, put
  # LOOM_JWT_SECRET_PREVIOUS in that Secret instead.
  jwtSecretPrevious: ""
  clickhousePassword: ""
  # The bearer token between the Loom pods and the extractor's
  # (LOOM_DOCUMENT_EXTRACTOR_TOKEN), 16 characters or more; needed with
  # extractor.enabled. With existingSecret, put that key in that Secret instead.
  extractorToken: ""
  # Extra keys, e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY, LOOM_CH_READER_PASSWORD.
  extra: {}

# Any other LOOM_* setting (docs/reference/configuration.md). Values are strings.
env: {}
# Settings as the YAML settings file holds them: lowercase field names, typed
# values (schemas/loom-settings.schema.json). Mounted at /app/config/loom.yaml;
# `env` wins over it, and the server refuses a secret in it. Empty = an empty settings map.
settingsFile: {}
# Extra env entries in Kubernetes form (valueFrom etc.).
extraEnv: []
envFrom: []
# Extra volumes and their mounts on the Loom container, e.g. a projected
# service-account token for a workload-identity exchange.
extraVolumes: []
extraVolumeMounts: []

# Peers whose X-Forwarded-For uvicorn trusts: the ingress controller's or load
# balancer's source range (on EKS with target-type ip: the ALB's subnets). Left
# at loopback behind a proxy, every client counts as the proxy for the per-address
# sign-in limits, so the chart refuses that with ingress.enabled.
trustedProxies: "127.0.0.1"

# Seconds uvicorn keeps an idle connection open. Longer than the idle timeout
# of the balancer in front, or it reuses a connection Loom just closed (a 502).
keepAliveSeconds: 75

# uvicorn processes per pod. Empty lets the image size it from the pod's CPU
# limit and memory (one per CPU, one per GiB, at most 8).
webWorkers: ""

shutdown:
  # Seconds a stopping pod keeps serving while answering not-ready. Longer than
  # the time your balancer takes to drop a not-ready target.
  readyDelaySeconds: 15
  # uvicorn's wait for in-flight requests after the port closes: at least the
  # longest call clients make (task.pull and task.updates wait up to 30 s).
  gracefulSeconds: 30
  # The lifespan drains (at most 40 s), participant retirement and slack.
  # terminationGracePeriodSeconds is the sum of the three.
  drainSeconds: 50

# Unless an ephemeral-storage request or limit is set here, the chart requests
# tmpSizeLimit plus, with cache.volume emptyDir, cache.sizeLimit (whole Gi).
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

probes:
  startup:
    # A first boot can run the migrations, or wait on another pod's
    # migration lease, and clone the git mirrors: up to 15 minutes.
    periodSeconds: 10
    failureThreshold: 90
  readiness:
    periodSeconds: 5
    failureThreshold: 2
  liveness:
    periodSeconds: 10
    failureThreshold: 3

strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Alert rules for the Prometheus Operator (a PrometheusRule), for a deployment that
# exports Loom's metrics over OTLP into Prometheus. Off by default: the chart
# installs no CRD. The thresholds are the LOOM_CODE_TIER_FAILING_* settings.
alerts:
  prometheusRule:
    enabled: false
    # Extra labels the Prometheus instance selects rules by (e.g. release: prometheus).
    labels: {}

autoscaling:
  # Rate-limit shares resize by themselves as pods come and go.
  enabled: false
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

service:
  type: ClusterIP
  port: 7777
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: loom.example.com
  #    paths: [{ path: /, pathType: Prefix }]
  tls: []

serviceAccount:
  create: true
  name: ""
  # IRSA (eks.amazonaws.com/role-arn) or other cloud identity annotations.
  annotations: {}
  # Mount the service-account token (retireLostPods mounts it too).
  automountToken: false

# The workers leader retires the provider participant of a pod Kubernetes has
# deleted (lost with its node, evicted past its grace period), which would
# otherwise hold the next model change until `loom participant retire`. Grants
# the service account `get` on pods in this namespace and mounts its token.
retireLostPods: true

podAnnotations: {}
podLabels: {}
# amd64 by default: the C++ compiler tier's scip-clang ships for x86_64 only. The
# rest of the image is multi-arch; on arm64 nodes set this to null and point
# LOOM_CODE_SCIP_CLANG_PATH at your own scip-clang build.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
priorityClassName: ""

# Spread pods over zones and nodes; off with topologySpread.enabled=false.
topologySpread:
  enabled: true
  zoneSkew: 1
  nodeSkew: 1
  whenUnsatisfiable: ScheduleAnyway
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The pod's cache at /app/var: git mirrors and checkouts, the Go module cache
# and lock files. Every pod rebuilds it (mirrors are cloned again), so it is
# lost with the pod. emptyDir counts against node storage and evicts the pod
# past sizeLimit; ephemeral gives each pod its own volume from a StorageClass.
# Size it for full clones of every indexed repository plus the Go module cache;
# the workers pods (`workers.cache`) also hold one checkout per compiler tier.
cache:
  volume: emptyDir
  sizeLimit: 20Gi
  ephemeral:
    storageClassName: ""
    size: 50Gi
    # Where each new pod's volume starts from instead of empty, e.g. a
    # VolumeSnapshot of a warm cache:
    #   { apiGroup: snapshot.storage.k8s.io, kind: VolumeSnapshot, name: loom-cache }
    # The mirrors then only fetch what is new.
    dataSourceRef: {}

# /tmp: repository-job and indexer scratch.
tmpSizeLimit: 4Gi

# The repository-job sandbox (bubblewrap) needs unprivileged user namespaces,
# which the default pod security does not grant. Off: the compiler tiers of the
# operator's repositories run as plain processes in the pod, and repositories
# added from the dashboard are refused. Required: a pod is ready only once the
# sandbox works, so set it after preparing the nodes
# (docs/operations/kubernetes.md).
sandbox:
  required: false
  # Merged over securityContext on the Loom container: the node's profiles, e.g.
  #   seccompProfile: { type: Localhost, localhostProfile: loom-repo-sandbox.json }
  #   appArmorProfile: { type: Localhost, localhostProfile: loom-repo-sandbox }
  #   procMount: Unmasked
  securityContext: {}
  # false runs the pod in its own user namespace (`hostUsers: false`), which
  # procMount: Unmasked requires (Kubernetes 1.33+).
  hostUsers: true

# A pre-upgrade Job that records this release's LOOM_JWT_SECRET as the root and
# publishes its env (`loom deployment publish --yes`), for a change to the root
# secret or the embedding settings, which cannot roll. The chart refuses such a
# change unless this is a token the pods do not carry yet (e.g. a date): the
# upgrade that brings a new token publishes, later ones with the same token
# don't. Pods on the old values answer 503 until the rollout replaces them.
mustMatchChange:
  publish: ""

# Separate background-workers Deployment (LOOM_SERVES_TRAFFIC=false). Off: the
# web pods elect one leader that runs the workers in a child process.
workers:
  enabled: false
  # One leader runs the workers; a second pod is a warm standby that takes the
  # lease within seconds of a graceful stop (30 s after a crash) and gets a PDB.
  replicaCount: 1
  # Sized for the C++ compiler tier: scip-clang runs `scipClangJobs` translation
  # units at once, a few GiB each on a large tree. Without a C++ entry 2 CPUs
  # and 8Gi are plenty.
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 32Gi
  # LOOM_CODE_SCIP_CLANG_JOBS on the workers pods (a web pod that leads the
  # workers runs 1); 0 = half the node's CPUs, which the memory limit rarely covers.
  scipClangJobs: 4
  # Merged over `cache` for the workers pods: mirrors plus a checkout (and its
  # build tree) per compiler tier, the Go module cache.
  cache: {}

# A daily CronJob that runs `loom export-analytics`: the previous UTC day's
# usage and a namespace snapshot as Parquet in an S3 bucket, for a data
# warehouse to load (docs/operations/analytics-export.md). It runs under its own
# service account, so the bucket's write access is never on the web pods.
analyticsExport:
  enabled: false
  # After midnight UTC, so the day it exports has ended.
  schedule: "30 0 * * *"
  bucket: ""
  prefix: ""
  # Org, namespace and agent leave as a keyed hash. The Secret holding the key
  # (a random string of 32 or more characters), read by the export pod only,
  # never by the web or workers pods. Required.
  nameKeySecret:
    name: ""
    key: LOOM_ANALYTICS_EXPORT_NAME_KEY
  # A writer role to assume (in the bucket's account) with the pod's credentials.
  # Empty: the pod's own role writes, and needs s3:PutObject itself.
  roleArn: ""
  region: ""
  # The account id that must own the bucket, quoted; a write to any other is refused.
  expectedBucketOwner: ""
  serviceAccount:
    # IRSA (eks.amazonaws.com/role-arn): a role that may only assume roleArn, or,
    # with roleArn empty, may only put objects into the bucket.
    annotations: {}
  # The pod's two emptyDirs are 1Gi each.
  resources:
    requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 2Gi }
    limits: { cpu: "1", memory: 2Gi, ephemeral-storage: 3Gi }

# The document extractor service (extractor/; docs/architecture/document-extraction.md):
# the parsers, in pods of their own that hold no Loom or ClickHouse credential
# and no service-account token. Only the release's Loom pods reach it, and its
# NetworkPolicy, rendered whatever networkPolicy.enabled says, lets it reach
# nothing. The Loom pods get its URL; the token is secrets.extractorToken.
extractor:
  enabled: false
  image:
    repository: ghcr.io/clickhouse/loom-extractor
    # Defaults to the chart's appVersion. Pin a version or digest in production.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Each pod runs one extraction at a time (LOOM_EXTRACTOR_CONCURRENCY): scale
  # with pods.
  replicaCount: 2
  # LOOM_EXTRACTOR_* settings (extractor/README.md), values as strings, e.g.
  # LOOM_EXTRACTOR_MEMORY_MB: "1024". The token and the address are the chart's.
  env: {}
  # One extraction's address space is LOOM_EXTRACTOR_MEMORY_MB (1 GiB) on top of
  # the service's own; the limit bounds the pod as a whole.
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1536Mi }
  nodeSelector: {}
  tolerations: []

# The assistant: LibreChat runs, headless, the agent Loom seeds
# (integrations/librechat/agent.yaml), with a MongoDB of its own. Neither is exposed:
# their NetworkPolicies admit only the release's Loom pods (and LibreChat to its
# MongoDB), and LibreChat's egress is DNS, the Loom pods and TCP 443 anywhere but
# `networkPolicy.egressExcept`, for its model provider.
assistant:
  enabled: false
  # A Secret in the release namespace with CREDS_KEY (64 hex), CREDS_IV (32 hex),
  # JWT_SECRET, JWT_REFRESH_SECRET and ANTHROPIC_API_KEY; required when enabled.
  existingSecret: ""
  image:
    repository: registry.librechat.ai/librechat-ai/librechat
    tag: v0.8.8
    digest: sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  mongo:
    image:
      repository: mongo
      tag: 8.0.20
      digest: sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
      pullPolicy: IfNotPresent
    storage: 2Gi
    storageClassName: ""
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  nodeSelector: {}
  tolerations: []

# Ingress to the Loom port from `ingressFrom` only. Egress to DNS, the
# release's web pods, the extractor's pods (with extractor.enabled), the dev
# ClickHouse (with devClickhouse.enabled), the EKS Pod Identity agent, and TCP
# 443, the ClickHouse port, postgres.port (with postgres.host) and 6443 (with
# retireLostPods) anywhere except `egressExcept` (providers, the IdP and git remotes
# have no fixed range); a ClickHouse or Postgres inside the cluster needs an
# extraEgress rule. Off,
# `guardMetadata` gives the Loom pods an egress-only policy that allows every pod
# and every address but `egressExcept`.
networkPolicy:
  enabled: false
  # NetworkPolicy peers allowed to reach the pods (the ALB's subnets, the
  # ingress controller's namespace). [] = any source.
  ingressFrom: []
  # Addresses a policy keeps the Loom pods off (the full policy's own rules and
  # extraEgress still allow theirs): the instance metadata service, so repository
  # code a pod builds cannot take the node's cloud role.
  # 169.254.169.254 serves most clouds, the IPv6 entries AWS and GCE. Add your
  # provider's addresses if not listed, other host endpoints that hand out node
  # credentials, and node or other non-pod ranges.
  egressExcept: [169.254.169.254/32, fd00:ec2::254/128, fd20:ce::254/128]
  # With enabled: false, render the egress-only policy above (none with
  # `egressExcept: []`). Set false when the pods take cloud credentials from the
  # metadata service (the node's role, GKE Workload Identity on Dataplane V2), or
  # when your own policies limit the pods' egress: NetworkPolicies add up, so this
  # one would let the pods reach everything else. Deny `egressExcept` there instead.
  guardMetadata: true
  # More egress rules for the full policy (enabled: true), e.g. SSH git remotes or
  # an OTLP collector.
  extraEgress: []

# A single-node ClickHouse with embedded Keeper inside the release, for kind or
# a laptop. Never production: no replication, one volume.
devClickhouse:
  enabled: false
  image: clickhouse/clickhouse-server:26.9.18.11
  password: loomdev
  storage: 10Gi
