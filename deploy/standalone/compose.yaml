# Self-contained evaluator stack distributed in loom-stack.tar.gz.
# The release bundle places the ClickHouse configuration beside this file, so
# it works outside a source checkout. The Loom image already contains the /me
# dashboard, migrations, server CLI and workers.

services:
  clickhouse:
    # LOOM_CLICKHOUSE_IMAGE overrides the tested release, e.g.
    # clickhouse/clickhouse-server:head for a master build (unsupported).
    image: ${LOOM_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.9.17.8}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: loom
      CLICKHOUSE_USER: loom
      CLICKHOUSE_PASSWORD: loomdev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - loom-ch-data:/var/lib/clickhouse
      - ./lemmagen3:/var/lib/clickhouse/lemmagen3:ro
      - ./clickhouse-config/lemmatizers.xml:/etc/clickhouse-server/config.d/lemmatizers.xml:ro
      - ./clickhouse-config/nlp_user_settings.xml:/etc/clickhouse-server/users.d/nlp_user_settings.xml:ro
      - ./clickhouse-config/merge_tree_settings.xml:/etc/clickhouse-server/config.d/merge_tree_settings.xml:ro
      - ./clickhouse-config/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./clickhouse-config/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  loom:
    # The per-server runtime files (server/core/runtime_files.py), empty on every start.
    tmpfs:
      - /run/loom:uid=999,gid=999,mode=0700
    image: "${LOOM_IMAGE_REPOSITORY:-ghcr.io/clickhouse/loom}:${LOOM_VERSION:-latest}"
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "${LOOM_BIND_HOST:-127.0.0.1}:${LOOM_PORT:-7777}:7777"
    env_file:
      - .env
    environment:
      LOOM_CH_HOST: clickhouse
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_READER_USER: loom_reader
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
      LOOM_DEPLOYMENT: "1"
      LOOM_INSTANCE_LABEL: "deploy:standalone"
      # The address the port is published on; see docs/operations/deployment.md.
      LOOM_BIND_HOST: "${LOOM_BIND_HOST:-127.0.0.1}"
      LOOM_BLOB_DIR: /app/var/blobs
    volumes:
      - loom-blob-data:/app/var/blobs
      - loom-code-repos:/app/var/code_repos
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7777/v1/health',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  loom-ch-data:
  loom-blob-data:
  loom-code-repos:
