[project]
name = "loom-extractor"
version = "1.0.0"
description = "Loom's reference extractor service: source files into the extraction artifact, over HTTP."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ClickHouse, Inc." }]
urls = { Repository = "https://github.com/ClickHouse/loom" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "cryptography>=50,<51", # pypdf's AES: a PDF encrypted with an owner password alone opens
  "pypdf>=6.21,<7",
  "sqlglot>=30.27,<31",   # imports sqlglot.tokenizer_core, which a major may move
  "starlette>=1.7",
  "uvicorn>=0.54",
]

[project.scripts]
loom-extractor = "loom_extractor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom_extractor"]
