name: Targeted MCP Inspector verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector:
    if: github.ref == 'refs/heads/ci/validate-mcp-inspector'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: efc992d9d39b534f3c9b6cb960f81fa908ad031c
      LOOM_ENV_FILE: ""
      LOOM_CH_CONTAINER: loom-ch-inspector-check
      LOOM_CH_HOST: "127.0.0.1"
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_READER_USER: loom_reader
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
      LOOM_AUTH_REQUIRED: "false"
      LOOM_EMBEDDING_MODEL: fake-ngram-1024
      LOOM_LLM_PROVIDER: fake
      LOOM_BACKGROUND_WORKERS: "off"
      LOOM_CODE_INGEST_ENABLED: "false"
      LOOM_LATENCY_BUDGET_MULTIPLIER: "10"
      LOOM_INSTANCE_LABEL: "ci:inspector-check"
      MCP_INSPECTOR_SECRET_STORE: memory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /LICENSE*
            /NOTICE*
            /pyproject.toml
            /uv.lock
            /server/
            /sdk/python/
            /scripts/
            /schemas/
            /dev/
            /extractor/
            /.github/mcp-inspector/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
      - name: Install locked server and Inspector dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          uv sync --locked --python 3.12 --extra dev --extra code
          npm --prefix .github/mcp-inspector ci --ignore-scripts --no-audit --no-fund
      - name: Run the pull request probe against a disposable server
        env:
          MCP_STORAGE_DIR: ${{ runner.temp }}/mcp-inspector
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          LOOM_CLICKHOUSE_IMAGE=$(bash dev/clickhouse_release.sh)
          export LOOM_CLICKHOUSE_IMAGE
          bash dev/ci_start_clickhouse.sh
          python -m server.core.schema.migrate
          LOOM_JWT_SECRET=$(openssl rand -hex 32)
          export LOOM_JWT_SECRET
          mkdir -p "$MCP_STORAGE_DIR"
          LOOM_WEB_WORKERS=1 sh scripts/serve.sh > "$RUNNER_TEMP/loom-inspector.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS --max-time 2 http://127.0.0.1:7777/v1/health >/dev/null && break
            kill -0 "$server"
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:7777/v1/health >/dev/null
          python - <<'PYTHON'
          from pathlib import Path

          from scripts.gates.docker_quickstart_smoke import request, smoke_mcp

          base = "http://127.0.0.1:7777"
          value = "MCP Inspector reads this disposable memory fixture"
          result = request(
              base,
              "/v1/memory.set",
              {
                  "org": "dev",
                  "namespace": "local",
                  "agent": "docker-smoke",
                  "memory_key": "docker/smoke",
                  "value": value,
              },
          )
          assert result["memory_id"]
          smoke_mcp(Path(".github/mcp-inspector/node_modules/.bin/mcp-inspector"), base, value)
          PYTHON
      - name: Remove the disposable database
        if: always()
        run: |
          if docker container inspect "$LOOM_CH_CONTAINER" >/dev/null 2>&1; then
            docker container rm --force "$LOOM_CH_CONTAINER"
          fi
