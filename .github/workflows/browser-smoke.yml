name: Dashboard browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "frontend/playwright.config.ts"
  schedule:
    - cron: "19 6 * * 4"

permissions:
  contents: read

jobs:
  dashboard-browser:
    name: Dashboard smoke (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      LOOM_BROWSER_SMOKE: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dashboard dependencies and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps "$LOOM_BROWSER_SMOKE"
      - name: Run navigation and keyboard tests
        working-directory: frontend
        run: npm run e2e -- --project="$LOOM_BROWSER_SMOKE" --retries=0
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-smoke-${{ matrix.browser }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 5
