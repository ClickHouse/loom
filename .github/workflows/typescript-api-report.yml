name: TypeScript API report

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "sdk/typescript/**"
      - ".github/ts-api-report/**"
      - ".github/workflows/typescript-api-report.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASELINE: "@clickhouse/loom@1.3.0"
      BASELINE_INTEGRITY: "sha512-HMRHzVmy9V295lkwXARRbDOWT3FtrHSZobPYkAzuDyyIvzQWqsa/XnlamBszImSfgLV3zQRBO+mt05SMad///A=="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the locked analysis tool
        working-directory: .github/ts-api-report
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack the SDK
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/baseline"
          npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/candidate"
          tar -xzf "$RUNNER_TEMP"/candidate/*.tgz -C "$RUNNER_TEMP/candidate"
      - name: Verify and unpack the release baseline
        working-directory: ${{ runner.temp }}/baseline
        run: |
          archive=$(npm pack --ignore-scripts --silent "$BASELINE")
          integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$integrity" = "$BASELINE_INTEGRITY"
          tar -xzf "$archive"
      - name: Compare public entry points
        run: |
          for version in baseline candidate; do
            ln -s "$PWD/sdk/typescript/node_modules" "$RUNNER_TEMP/$version/package/node_modules"
          done
          node .github/ts-api-report/report.cjs "$RUNNER_TEMP/baseline/package" \
            "$RUNNER_TEMP/candidate/package" "$RUNNER_TEMP/api-report"
          head -n 1 "$RUNNER_TEMP/api-report/typescript-api.diff" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-api-diff
          path: ${{ runner.temp }}/api-report/typescript-api.diff
          if-no-files-found: error
          retention-days: 7
