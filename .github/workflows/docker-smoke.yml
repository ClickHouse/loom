name: docker-smoke

on:
  push:
    branches: [main]
    paths:
      [
        "Dockerfile",
        "server/**",
        "schemas/**",
        "scripts/gates/docker*",
        "frontend/**",
        "tests/fixtures/docker_provider_app.py",
        "scripts/install-code-toolchains.sh",
        "scripts/serve.sh",
        "scripts/scip_harness/**",
        "scripts/release/build_stack_bundle.py",
        "dev/clickhouse_release.sh",
        "deploy/standalone/**",
        "deploy/clickhouse-config/**",
        "install.sh",
        "pyproject.toml",
        ".github/workflows/docker-smoke.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "Dockerfile",
        "server/**",
        "schemas/**",
        "scripts/gates/docker*",
        "frontend/**",
        "tests/fixtures/docker_provider_app.py",
        "scripts/install-code-toolchains.sh",
        "scripts/serve.sh",
        "scripts/scip_harness/**",
        "scripts/release/build_stack_bundle.py",
        "dev/clickhouse_release.sh",
        "deploy/standalone/**",
        "deploy/clickhouse-config/**",
        "install.sh",
        "pyproject.toml",
        ".github/workflows/docker-smoke.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quickstart:
    name: Quickstart (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard browser-test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: loom:docker-smoke
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=docker-smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-smoke-${{ matrix.arch }}
      - name: Fresh installer, compiler indexing and dashboard provider recovery
        run: python3 scripts/gates/docker_quickstart_smoke.py --image loom:docker-smoke
