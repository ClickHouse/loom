name: Rust dependency graph

on:
  pull_request:
    branches: [main]
    paths:
      - "sdk/rust/**"
      - ".github/scripts/rust-dependency-snapshot.py"
      - ".github/workflows/rust-dependency-graph.yml"
  push:
    branches: [main]
    paths:
      - "sdk/rust/**"
      - ".github/scripts/rust-dependency-snapshot.py"
      - ".github/workflows/rust-dependency-graph.yml"
  schedule:
    - cron: "43 5 * * 2"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_TOOLCHAIN: "1.84.1"
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the SDK dependency graph
        working-directory: sdk/rust
        run: |
          rustup toolchain install "$CARGO_TOOLCHAIN" --profile minimal
          cargo "+$CARGO_TOOLCHAIN" generate-lockfile
          cargo "+$CARGO_TOOLCHAIN" metadata --all-features --locked --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Generate a snapshot
        run: |
          python3 .github/scripts/rust-dependency-snapshot.py "$RUNNER_TEMP/cargo-metadata.json" \
            "$RUNNER_TEMP/rust-snapshot.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-dependency-snapshot
          path: ${{ runner.temp }}/rust-snapshot.json
          if-no-files-found: error
          retention-days: 1

  submit:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-dependency-snapshot
          path: ${{ runner.temp }}/rust-dependency-snapshot
      - name: Submit this run's snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="$RUNNER_TEMP/rust-dependency-snapshot/rust-snapshot.json"
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.sha == $sha and .ref == "refs/heads/main" and .job.id == $run' "$snapshot" > /dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$snapshot"
