name: workflow lint

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the workflow linter
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 2 --retry-all-errors --retry-max-time 85 --connect-timeout 10 --max-time 40 \
            https://github.com/jdx/jactionlint/releases/download/v2.6.0/jactionlint_2.6.0_linux_amd64.tar.gz \
            --output jactionlint.tar.gz
          echo 'd5400967b8f0d3a5ae9a4cee21f56400a50eb3f05d0cbb4ef17184f17f0760c8  jactionlint.tar.gz' | sha256sum --check --strict
          tar -xzf jactionlint.tar.gz jactionlint
      - name: Install ShellCheck
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 2 --retry-all-errors --retry-max-time 85 --connect-timeout 10 --max-time 40 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output shellcheck.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz' | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
      - name: Check every workflow
        env:
          # Reject shell errors and warnings without imposing style diagnostics.
          SHELLCHECK_OPTS: --severity=warning
        run: |
          test -x "$RUNNER_TEMP/shellcheck"
          "$RUNNER_TEMP/jactionlint" --profile correctness --color --shellcheck="$RUNNER_TEMP/shellcheck" --pyflakes=
