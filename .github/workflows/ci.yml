name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels its superseded run. Every push to main
# runs to completion in its own group, so a failure on one merge commit is
# never hidden by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository; none needs a write scope.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  # The Python jobs install the exact versions in uv.lock with this uv.
  UV_VERSION: "0.12.19"

jobs:
  clickhouse:
    name: the ClickHouse release this run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `latest` moves; every job of this run takes the release it names now.
      # Assigned first: a failed lookup then fails the step instead of writing "image=".
      - id: resolve
        run: |
          image=$(bash dev/clickhouse_release.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"

  lint:
    name: ruff + mypy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (dev, code extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: ruff
        run: ruff check server extractor sdk/python tests scripts .claude
      - name: ruff format
        run: ruff format --check .
      # The Python SDK's op table, TypedDicts and per-op client are generated
      # from the registry; a server change that alters a wire shape
      # must regenerate them in the same PR.
      - name: generated loom/ops.py and loom/client.py are current
        run: |
          python scripts/codegen/sdk_py_gen.py --check
          python scripts/codegen/sdk_py_client_gen.py --check
          python scripts/codegen/sdk_py_admin_gen.py --check
      # The Codex plugin's hook scripts, library and skills are copies of the
      # Claude Code plugin's; a change to one must be synced. The check compares
      # bytes and the executable bit.
      - name: codex plugin copies are current (bytes and executable bit)
        run: python scripts/codegen/agent_plugin_sync.py --check
      # docs/reference/ (configuration and the generated tables) and
      # server/operations/reach_manifest.py are generated too; the unit suite
      # checks them, this step fails faster.
      - name: docs reference and reach manifest are current
        run: |
          python scripts/codegen/settings_reference.py --check
          python scripts/codegen/settings_schema.py --check
          python scripts/codegen/docs_reference.py --check
          python scripts/codegen/op_reach_census.py --check
      # The SDK ships py.typed: it is type-checked strictly
      # on its own, apart from the server's ratchet below.
      - name: mypy --strict on the Python SDK
        run: mypy --strict sdk/python/loom
      # mypy is gated as a RATCHET, not all-or-nothing: the codebase carries
      # pre-existing strict-mypy errors frozen as a baseline in
      # scripts/gates/mypy_baseline.json. This step fails only on NEW errors past that
      # baseline; lower the baseline as the debt is paid down.
      - name: mypy-gate
        run: python scripts/gates/mypy_gate.py
      # Function-length ratchet: ruff PLR0915 against a
      # committed per-file baseline that only shrinks — no file may gain an
      # oversized function; today's inventory is tolerated until split.
      - name: function-length-gate
        run: python scripts/gates/function_length_gate.py
      # Content-based, not filename-based: .gitignore only stops the next file
      # with a name you already thought of.
      - name: no committed secrets
        run: python scripts/gates/check_no_secrets.py

  # The unit suite in parts, each on its own runner (LOOM_TEST_SHARD, whole files:
  # tests/_shards.py) and over that runner's cores; unit-coverage combines their
  # coverage data and applies the floors.
  unit:
    name: pytest unit part ${{ matrix.part }}
    needs: clickhouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The part count, 6, is also in docs/development/testing.md's unit row and
        # the loom-investigate-ci row.
        part: [1, 2, 3, 4, 5, 6]
    env:
      LOOM_CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
    # No ClickHouse service: unit tests skip cleanly when env config is absent.
    # The clickhouse binary is installed for clickhouse-local / -format checks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Node runs the TypeScript SDK's credentials beside the Python SDK's
      # (test_sdk_ts_credentials_compat.py).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (dev, code extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Fetch origin/main for the migration-number check
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # The clickhouse binary (as clickhouse-local and clickhouse-format) for the
      # unit tests that run production SQL locally, such as the pending-grant
      # checks. The run's release, so the parser and engine are the
      # integration job's server.
      - name: Install the clickhouse binary
        run: |
          id=$(docker create "$LOOM_CLICKHOUSE_IMAGE")
          sudo docker cp -L "$id:/usr/bin/clickhouse" /usr/local/bin/clickhouse
          docker rm "$id" >/dev/null
          sudo ln -sf clickhouse /usr/local/bin/clickhouse-format
          clickhouse local --query "SELECT version()"
      # Random order over one worker per core, so a test that depends on another
      # fails here; reproduce a failure as tests/README.md describes.
      - name: pytest unit (this part, random order)
        env:
          LOOM_TEST_SHARD: ${{ matrix.part }}/${{ strategy.job-total }}
          COVERAGE_FILE: .coverage.unit-${{ matrix.part }}
        run: |
          SEED="${{ github.run_id }}${{ github.run_attempt }}"
          echo "pytest-randomly seed: $SEED"
          pytest tests/unit -q -n auto -p randomly --randomly-seed="$SEED" --durations=15 \
            --cov=server --cov=sdk/python/loom --cov-branch --cov-report= \
            --junitxml=junit-unit-${{ matrix.part }}.xml
      # Also after a failure: the failing part's test times are what a reader needs.
      - name: Upload this part's coverage data and test times
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ matrix.part }}
          path: |
            .coverage.unit-${{ matrix.part }}
            junit-unit-${{ matrix.part }}.xml
          include-hidden-files: true
          if-no-files-found: warn
          # A re-run of one failed part replaces the data its first attempt uploaded.
          overwrite: true

  unit-coverage:
    name: pytest unit coverage, floors and bench
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (dev, code extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Download the parts' coverage data and test times
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-unit-*
          merge-multiple: true
      # This run's seconds per test file, the weights the next split balances by
      # when committed as tests/shard_weights.json (tests/_shards.py).
      - name: Shard weights from this run
        run: python -m tests._shards junit-unit-*.xml
      - name: Upload shard weights
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-weights
          path: tests/shard_weights.json
      # One data file per part, measured in the same checkout path, so they combine
      # into the totals one run over the whole suite measures.
      - name: Combine coverage (floor 40%)
        run: |
          coverage combine .coverage.unit-*
          coverage report --fail-under=40
          coverage xml
          coverage json -o coverage.json
      # Per-module branch floors for the auth, write-path, erasure, migration
      # and supervisor modules (tests/inventory/coverage_floors.toml).
      - name: branch-coverage floors
        run: python -m tests.inventory.coverage_floors coverage.json
      # The published benchmark harnesses' scoring and dataset readers.
      - name: pytest bench harnesses
        run: pytest bench -q -p randomly --randomly-seed="${{ github.run_id }}${{ github.run_attempt }}"
      # The generic ingest script's dry run goes through this checkout's CLI.
      - name: generic integration sample
        run: PYTHON=python bash integrations/generic/test.sh
      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml

  sandbox:
    name: repository-job sandbox (real bubblewrap)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The hostile suite skips where bwrap cannot create namespaces;
    # LOOM_TEST_REQUIRE_SANDBOX=1 turns that skip into a failure here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (dev, code extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # prlimit comes with util-linux. Ubuntu 24.04 restricts unprivileged user
      # namespaces through AppArmor; the sandbox needs them.
      - name: Install bubblewrap and allow user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --ro-bind / / true
      - name: pytest hostile sandbox suite
        env:
          LOOM_TEST_REQUIRE_SANDBOX: "1"
        run: pytest tests/unit/test_repo_job_sandbox_hostile.py -q -p randomly --randomly-seed="${{ github.run_id }}${{ github.run_attempt }}"

  schema-check:
    name: schema.sql in sync with migrations
    needs: clickhouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOOM_CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
      LOOM_CH_HOST: localhost
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (no extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Start ClickHouse (loom config + lemmagen dictionary)
        run: bash dev/ci_start_clickhouse.sh
      - name: Apply every migration to fresh ClickHouse
        run: python -m server.core.schema.migrate
      # The ledger reader the deploy preflight relies on:
      # after applying everything, ledger ⊆ repo files, no checksum drift,
      # nothing pending — or the strict dry-run exits 1.
      - name: Ledger is a subset of the repo (strict dry-run)
        run: python -m server.core.schema.migrate --dry-run --strict
      - name: Verify schemas/schema.sql matches what migrations produce
        run: make schema-check

  ts-typecheck:
    name: tsc (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + build frontend (build runs tsc -b internally)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # The index chunk stays under budget and carries
      # no surface that opens on a click (a flow dialog, the search body, a view).
      - name: bundle budget (index chunk)
        working-directory: frontend
        run: npm run budget

  format:
    name: format (biome, prettier, taplo, shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: install shfmt v3.10.0
        run: |
          curl -sSfL -o /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          echo "1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc  /usr/local/bin/shfmt" | sha256sum -c -
          chmod +x /usr/local/bin/shfmt
      - name: biome
        run: npx --yes @biomejs/biome@2.5.14 format .
      # The dashboard's accessibility rules (biome.json overrides): a new violation fails here.
      - name: biome lint (dashboard accessibility)
        run: npx --yes @biomejs/biome@2.5.14 lint frontend/src
      - name: prettier
        run: npx --yes prettier@3.9.9 --check --log-level warn "**/*.{md,yml,yaml}"
      - name: taplo
        run: npx --yes @taplo/cli@0.7.0 format --check
      - name: shfmt
        run: git ls-files '*.sh' ':!tests/fixtures' | xargs shfmt -d

  helm:
    name: helm chart (lint, kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install helm v3.16.2 and kubeconform v0.6.7
        run: |
          curl -sSfL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz
          echo "9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -sSfL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp && sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: lint and validate every overlay
        run: |
          set -euo pipefail
          chart=deploy/helm/loom
          secret=$(openssl rand -hex 32)
          # Every optional object on, so each template renders at least once.
          on=(--set analyticsExport.enabled=true --set analyticsExport.bucket=ci --set analyticsExport.nameKeySecret.name=ci)
          extractor=(--set extractor.enabled=true --set secrets.extractorToken="$(openssl rand -hex 24)")
          all=(--set workers.enabled=true --set workers.replicaCount=2 --set autoscaling.enabled=true --set networkPolicy.enabled=true --set alerts.prometheusRule.enabled=true --set mustMatchChange.publish=ci --set settingsFile.memory_ask_recency_weight=0.3 "${on[@]}" "${extractor[@]}")
          # The PrometheusRule's schema: the CRD catalog at a pinned commit.
          crd='https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

          for overlay in values-eks.yaml values-kind.yaml; do
            args=(-f "$chart/$overlay" --set secrets.jwtSecret="$secret")
            helm lint --strict "$chart" "${args[@]}"
            helm lint --strict "$chart" "${args[@]}" "${all[@]}"
            helm template loom "$chart" "${args[@]}" | kubeconform -strict -summary -kubernetes-version 1.30.0
            helm template loom "$chart" "${args[@]}" "${all[@]}" | kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location default -schema-location "$crd"
          done
          kubeconform -strict -summary -kubernetes-version 1.30.0 deploy/okf-sync/cronjob.yaml
          # Values the chart must refuse, each with its own message. A refused render
          # exits non-zero, so the output is taken first and read after.
          refused() {
            local want=$1; shift
            if out=$(helm template loom "$chart" -f "$chart/values-kind.yaml" --set secrets.jwtSecret="$secret" "$@" 2>&1); then
              echo "the chart accepted $*"; exit 1
            fi
            grep -qF "$want" <<<"$out" || { echo "unexpected refusal for $*: $out"; exit 1; }
            echo "refused as expected: $*"
          }
          # The analytics name key reaches the export pod only, never the web pods.
          key="set LOOM_ANALYTICS_EXPORT_NAME_KEY through analyticsExport.nameKeySecret"
          refused "$key" --set env.LOOM_ANALYTICS_EXPORT_NAME_KEY=x
          refused "$key" --set secrets.extra.LOOM_ANALYTICS_EXPORT_NAME_KEY=x
          refused "$key" --set "extraEnv[0].name=LOOM_ANALYTICS_EXPORT_NAME_KEY"
          refused "$key" --set settingsFile.analytics_export_name_key=x
          refused "needs analyticsExport.bucket" "${on[@]}" --set analyticsExport.bucket=
          refused "needs analyticsExport.nameKeySecret.name" "${on[@]}" --set analyticsExport.nameKeySecret.name=
          refused "expectedBucketOwner must be a quoted string" "${on[@]}" --set analyticsExport.expectedBucketOwner=123456789012
          # The release Secret (named after the release here) and envFrom Secrets reach every pod.
          shared="is a Secret every web and workers pod loads"
          refused "$shared" "${on[@]}" --set analyticsExport.nameKeySecret.name=loom
          refused "$shared" "${on[@]}" --set "envFrom[0].secretRef.name=ci"
          # The extractor's token is the release Secret's, 16 characters or more.
          refused "extractor.enabled needs secrets.extractorToken" --set extractor.enabled=true
          refused "secrets.extractorToken must be at least 16 characters" --set extractor.enabled=true --set secrets.extractorToken=short
          refused "through secrets.extractorToken, not secrets.extra" "${extractor[@]}" --set secrets.extra.LOOM_DOCUMENT_EXTRACTOR_TOKEN=x
          refused "extractor.env cannot set LOOM_EXTRACTOR_TOKEN" "${extractor[@]}" --set extractor.env.LOOM_EXTRACTOR_TOKEN=x
          token="set it through secrets.extractorToken"
          refused "$token" "${extractor[@]}" --set env.LOOM_DOCUMENT_EXTRACTOR_TOKEN=x
          refused "$token" "${extractor[@]}" --set "extraEnv[0].name=LOOM_DOCUMENT_EXTRACTOR_TOKEN"
          refused "$token" "${extractor[@]}" --set settingsFile.document_extractor_token=x
          # guardMetadata is a bool and egressExcept a list; anything else is refused by name.
          refused "networkPolicy.guardMetadata must be true or false" --set-string networkPolicy.guardMetadata=false
          refused "networkPolicy.guardMetadata must be true or false" --set networkPolicy.guardMetadata=0
          refused "networkPolicy.guardMetadata must be true or false" --set networkPolicy.enabled=true --set-string networkPolicy.guardMetadata=true
          refused "networkPolicy.egressExcept must be a list of CIDRs" --set networkPolicy.egressExcept=169.254.169.254/32
          refused "networkPolicy.egressExcept must be a list of CIDRs" --set networkPolicy.egressExcept=
          refused "networkPolicy.egressExcept must be a list of CIDRs" --set networkPolicy.egressExcept=0
      - name: install PyYAML for the render gates
        run: python3 -m pip install --quiet --user pyyaml==6.0.3
      # What the extractor's pods can be reached by and reach, read off the render.
      - name: extractor isolation
        run: python3 scripts/gates/helm_extractor_isolation.py
      # No Loom pod reaches the instance metadata service, with the policy on or off.
      - name: metadata egress
        run: python3 scripts/gates/helm_metadata_egress.py

  agent-plugins:
    name: coding-agent plugins (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The hook scripts have no dependencies and run under any Node >= 18;
      # their tests are node:test files beside them.
      - name: node --test (hook scripts shared by the Claude Code and Codex plugins)
        run: node --test integrations/claude-code-plugin/tests/*.test.mjs
      - name: node --test (grep shim)
        run: node --test integrations/grep-shim/tests/*.test.mjs
      - name: Cursor hook sample
        run: bash integrations/cursor/test.sh
      - name: every hook, helper and shim script parses
        run: for f in integrations/{claude-code-plugin,codex-plugin}/{hooks,lib,bin}/*.mjs integrations/grep-shim/bin/* integrations/grep-shim/lib/*.mjs; do node --check "$f"; done
      - name: the Node launcher parses
        run: for f in integrations/{claude-code-plugin,codex-plugin}/bin/loom-node; do sh -n "$f"; done
      # The shim is installed by putting grep-shim/bin on PATH, so each entry
      # point must resolve to an executable file. The plugins' executable bits
      # are compared source-to-copy by the plugin sync check in the lint job.
      - name: grep shim entry points are executable
        run: for f in integrations/grep-shim/bin/*; do test -x "$f" || { echo "::error file=$f::not executable"; exit 1; }; done
  # The dashboard's vitest and Playwright suites share nothing but `npm ci`, so
  # each runs as its own job, split into parts on separate runners.
  frontend-vitest:
    name: frontend vitest part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Unit tests on the landing rule, formatters, navigation and hooks;
      # component tests; axe-core over the components that render in
      # isolation. jsdom, no browser.
      - name: vitest (unit + component + axe)
        working-directory: frontend
        run: npm run test -- --shard=${{ matrix.part }}/${{ strategy.job-total }}

  # With fullyParallel: false, --shard splits by spec file per project, not by test.
  frontend-e2e:
    name: frontend playwright part ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # The e2e specs in frontend/e2e/ against the production build, every /v1/*
      # call answered from fixtures.
      - name: playwright (e2e specs)
        working-directory: frontend
        run: npm run e2e -- --shard=${{ matrix.part }}/${{ strategy.job-total }}
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-${{ matrix.part }}
          path: |
            frontend/e2e-screenshots
            frontend/test-results
          if-no-files-found: ignore

  # Each part is its own runner and ClickHouse. The numbered parts each run their
  # share of tests/integration (LOOM_TEST_SHARD, whole files: tests/_shards.py)
  # against an auth-off server; the isolation gates part runs the provider staging
  # tests, the tenant-isolation gates against an auth-on server, and the
  # analyzer corpus.
  integration:
    name: pytest integration ${{ matrix.part == 'isolation' && 'isolation gates' || format('part {0} of 4', matrix.part) }}
    needs: clickhouse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The part count, 4, is also in this job's name, its LOOM_TEST_SHARD, the docs
        # bullet on parts (docs/development/testing.md) and the loom-investigate-ci row.
        part: ["1", "2", "3", "4", isolation]
    env:
      LOOM_CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
      LOOM_CH_HOST: localhost
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_READER_USER: loom_reader
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
      LOOM_AUTH_REQUIRED: "false"
      LOOM_JWT_SECRET: ci-only-jwt-secret
      # Overrides reach every web process within one refresh; the tests wait it out.
      LOOM_RUNTIME_OVERRIDES_REFRESH_SECONDS: "1"
      # Extraction policies and the model-call switch likewise; the tests wait it out.
      LOOM_MODEL_CALLS_POLICY_REFRESH_SECONDS: "2"
      LOOM_BASE_URL: http://localhost:7777
      LOOM_EMBEDDING_MODEL: fake-ngram-1024
      LOOM_LLM_PROVIDER: fake
      # GH Actions runners are noisy enough that the default per-op
      # budgets (e.g. memory.set p99=30ms) fire violations on most
      # runs. Multiply by 10x — same knob docs/operations/deployment.md recommends
      # for CH Cloud over WAN. Per-op overrides at runtime go through
      # POST /v1/admin/budget.set, not env vars.
      LOOM_LATENCY_BUDGET_MULTIPLIER: "10"
      # Memory webhook tests POST to a receiver on 127.0.0.1 over http, and wait one
      # registry refresh after registering.
      LOOM_MEMORY_WEBHOOK_ALLOW_HTTP: "true"
      LOOM_MEMORY_WEBHOOK_PRIVATE_HOSTS: "127.0.0.1"
      LOOM_MEMORY_WEBHOOK_REFRESH_SECONDS: "1"
      # A pure web replica: tests that exercise a worker call its `run_pass`
      # in-process against their own namespace. A live supervisor's workers
      # have no namespace filter and would drain those tests' rows.
      LOOM_BACKGROUND_WORKERS: "off"
      # A process outside the compose deployment must say who
      # launched it, or it refuses to boot.
      LOOM_INSTANCE_LABEL: "ci:integration"
      # The deployment's default code namespace, which bare code.* calls resolve to.
      LOOM_CODE_ORG: ci
      LOOM_CODE_NAMESPACE: code-ci
      LOOM_CODE_REPO: example/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (dev, code extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Start ClickHouse (loom config + lemmagen dictionary)
        run: bash dev/ci_start_clickhouse.sh
      - name: Apply migrations
        id: migrate
        run: python -m server.core.schema.migrate
      # Provider staging tests create private, UUID-owned copies and run before
      # the web process starts, against this job's disposable migrated database.
      - name: Provider rebuild storage and recovery
        if: matrix.part == 'isolation'
        env:
          LOOM_PROVIDER_STAGING_LIVE_TEST: "1"
        run: >-
          pytest -q
          tests/integration/test_provider_cache_live_ch.py
          tests/integration/test_provider_coordination_live_ch.py
          tests/integration/test_provider_cleanup_live_ch.py
          tests/integration/test_provider_inventory_live_ch.py
          tests/integration/test_provider_large_page_live_ch.py
          tests/integration/test_provider_prefix_live_ch.py
          tests/integration/test_provider_prepared_live_ch.py
          tests/integration/test_provider_publish_live_ch.py
          tests/integration/test_provider_source_policy_live_ch.py
          tests/integration/test_provider_staging_live_ch.py
          tests/integration/test_provider_views_live_ch.py
      # The service in front of Loom that signs a token per end user: the part's
      # server trusts its fresh key (LOOM_JWT_END_USER_ISSUERS_JSON) and the
      # tests sign with it (LOOM_TEST_END_USER_KEY).
      - name: Test end-user issuer
        id: issuer
        if: steps.migrate.outcome == 'success' && !cancelled()
        run: python -m tests.end_user_issuer "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # The reference extractor, before the part's server boots so it reads its URL and token:
      # the ingestion tests' jobs call it and knowledge.inspect reports it as configured.
      - name: Start the reference extractor
        id: extractor
        if: steps.migrate.outcome == 'success' && !cancelled()
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          (cd extractor && LOOM_EXTRACTOR_TOKEN="$token" LOOM_EXTRACTOR_PORT=8790 \
            nohup python -m loom_extractor > "$GITHUB_WORKSPACE/extractor.log" 2>&1 &)
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8790/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8790/healthz >/dev/null || { tail -50 extractor.log; exit 1; }
          echo "LOOM_DOCUMENT_EXTRACTOR_URL=http://127.0.0.1:8790" >> "$GITHUB_ENV"
          echo "LOOM_DOCUMENT_EXTRACTOR_TOKEN=$token" >> "$GITHUB_ENV"
      # The image's launcher with several web processes, so state that must
      # bind every process (rate limits, budgets, schema caches) is tested.
      - name: Boot control plane
        if: matrix.part != 'isolation'
        run: |
          LOOM_WEB_WORKERS=3 nohup sh scripts/serve.sh > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:7777/v1/health && exit 0
            sleep 1
          done
          echo "control plane never became healthy"
          tail -100 server.log
          exit 1
      # A local S3-compatible store for the document object-store tests
      # (tests/integration/test_document_object_store_live.py).
      - name: Start a local S3-compatible store
        if: matrix.part != 'isolation'
        run: |
          docker run -d --name loom-ci-s3 -p 127.0.0.1:5000:5000 \
            motoserver/moto@sha256:32d7805d8bd4c81db789c4fff2c36f96a8837cbd8e7a3853116b6516b9490dde
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5000/ >/dev/null
          echo "LOOM_TEST_S3_ENDPOINT=http://127.0.0.1:5000" >> "$GITHUB_ENV"
      # The whole directory on every pull request, split over the parts; no test
      # is slow enough to justify a separate merge-only tier.
      - name: pytest (this part of tests/integration)
        if: matrix.part != 'isolation'
        env:
          LOOM_TEST_SHARD: ${{ matrix.part }}/4
        run: pytest tests/integration -q --durations=20
      # The tenant-isolation gates against a server that enforces auth. The numbered
      # parts run them with auth off, where every token is ignored and no refusal is seen.
      # The three checks of the isolation gates part are independent: a failure in
      # one does not skip the next (`!cancelled()`).
      - name: Boot control plane with auth on
        id: auth_on
        if: >-
          matrix.part == 'isolation' && !cancelled() && steps.issuer.outcome == 'success'
          && steps.extractor.outcome == 'success'
        env:
          LOOM_AUTH_REQUIRED: "true"
          LOOM_INSTANCE_LABEL: "ci:integration-auth"
        # Several web processes, as the image runs: a session's MCP calls and its
        # DELETE land on different ones.
        run: |
          LOOM_WEB_WORKERS=3 PORT=7778 nohup sh scripts/serve.sh > server-auth.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:7778/v1/health && exit 0
            sleep 1
          done
          echo "auth-on control plane never became healthy"
          tail -100 server-auth.log
          exit 1
      - name: pytest isolation gates (auth on)
        if: matrix.part == 'isolation' && !cancelled() && steps.auth_on.outcome == 'success'
        env:
          LOOM_AUTH_REQUIRED: "true"
          LOOM_BASE_URL: http://localhost:7778
        run: >-
          pytest -q
          tests/integration/test_cross_principal_leakage.py
          tests/integration/test_read_scope_isolation.py
          tests/integration/test_extraction_status_mine.py
          tests/integration/test_token_mint.py
          tests/integration/test_onboard_tenant.py
          tests/integration/test_session_briefs.py
          tests/integration/test_blacklist.py
          tests/integration/test_sensitivity_high_canary.py
          tests/integration/test_run_begin_claims.py
          tests/integration/test_mcp_session_run_scope.py
          tests/integration/test_projection_failures_restricted.py
      # The statement corpus: every builder's shapes through
      # EXPLAIN QUERY TREE on the migrated service, and shapes.txt in step
      # with the builders. ~10 s; a rejection here is a statement that would
      # fail on a deployed server.
      - name: analyzer statement corpus
        if: matrix.part == 'isolation' && steps.migrate.outcome == 'success' && !cancelled()
        run: pytest tests/analyzer -q
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-log-${{ matrix.part }}
          path: |
            server.log
            server-auth.log
            extractor.log

  integration-postgres:
    name: pytest integration (Postgres ${{ matrix.postgres }} memory authority)
    needs: clickhouse
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The oldest supported major and the newest.
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    env:
      LOOM_CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
      LOOM_CH_HOST: localhost
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_READER_USER: loom_reader
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
      LOOM_AUTH_REQUIRED: "false"
      LOOM_JWT_SECRET: ci-only-jwt-secret
      LOOM_RUNTIME_OVERRIDES_REFRESH_SECONDS: "1"
      LOOM_BASE_URL: http://localhost:7777
      LOOM_EMBEDDING_MODEL: fake-ngram-1024
      LOOM_LLM_PROVIDER: fake
      LOOM_LATENCY_BUDGET_MULTIPLIER: "10"
      LOOM_BACKGROUND_WORKERS: "off"
      LOOM_INSTANCE_LABEL: "ci:integration-postgres"
      # The deployment's default code namespace, which the leakage gates' code-scope
      # cases resolve bare code.* calls to.
      LOOM_CODE_ORG: ci
      LOOM_CODE_NAMESPACE: code-ci
      LOOM_CODE_REPO: example/ci
      # The end-user policy cases wait out a refresh: 2 s, as the integration parts use.
      LOOM_MODEL_CALLS_POLICY_REFRESH_SECONDS: "2"
      # Stock Postgres with one synchronous standby (dev/ci_start_postgres.sh).
      LOOM_STORAGE_AUTHORITY: postgres
      LOOM_PG_DSN: postgres://loom:loomdev@localhost:5432/loom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (dev, code extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Start ClickHouse (loom config + lemmagen dictionary)
        run: bash dev/ci_start_clickhouse.sh
      - name: Start Postgres with a synchronous standby
        env:
          LOOM_PG_IMAGE: postgres:${{ matrix.postgres }}
        run: bash dev/ci_start_postgres.sh
      - name: Apply migrations
        run: python -m server.core.schema.migrate
      # The service in front of Loom that signs a token per end user, so the isolation
      # gates' end-user cases run against the Postgres read paths too.
      - name: Test end-user issuer
        id: issuer
        run: python -m tests.end_user_issuer "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Boot control plane
        run: |
          LOOM_WEB_WORKERS=3 nohup sh scripts/serve.sh > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:7777/v1/health && exit 0
            sleep 1
          done
          echo "control plane never became healthy"
          tail -100 server.log
          exit 1
      - name: pytest (Postgres authority, memory and isolation)
        run: >-
          pytest -q
          tests/integration/test_pg_authority.py
          tests/integration/test_restored_memory_ids.py
          tests/integration/test_memory_import.py
          tests/integration/test_cross_principal_leakage.py
          tests/integration/test_memory_get.py
          tests/integration/test_served_reads.py
          tests/integration/test_memory_by_id.py
          tests/integration/test_memory_bulk.py
          tests/integration/test_memory_pin.py
          tests/integration/test_memory_lock.py
          tests/integration/test_memory_precondition.py
          tests/integration/test_memory_delete_list.py
          tests/integration/test_memory_conflicts.py
          tests/integration/test_memory_touch.py
          tests/integration/test_memory_history_redact.py
          tests/integration/test_memory_expiry.py
          tests/integration/test_memory_promote.py
          tests/integration/test_memory_search.py
          tests/integration/test_memory_apply.py
          tests/integration/test_memory_valid_at.py
          tests/integration/test_memory_verify.py
          tests/integration/test_bulk_conflicts.py
          tests/integration/test_blacklist.py
          tests/integration/test_idempotency.py
          tests/integration/test_erasure.py
      # The tenant-isolation gates again, against a second server that enforces auth:
      # the Postgres read paths (heads by key and by id, narrowed scopes) see real tokens.
      # They run whether or not the memory suites passed (`!cancelled()`).
      - name: Boot control plane with auth on
        id: auth_on
        if: ${{ !cancelled() && steps.issuer.outcome == 'success' }}
        env:
          LOOM_AUTH_REQUIRED: "true"
          LOOM_INSTANCE_LABEL: "ci:integration-postgres-auth"
        run: |
          LOOM_WEB_WORKERS=3 PORT=7778 nohup sh scripts/serve.sh > server-auth.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:7778/v1/health && exit 0
            sleep 1
          done
          echo "auth-on control plane never became healthy"
          tail -100 server-auth.log
          exit 1
      # The isolation files that write or read memory. Two read-scope tests seed
      # superseded and duplicate rows by writing ClickHouse directly, rows the Postgres
      # authority never held, and the isolation part's other files (run claims, the
      # extraction queue, projection failures) hold no Postgres row: they run on the
      # ClickHouse job.
      - name: pytest isolation gates (Postgres authority, auth on)
        if: ${{ !cancelled() && steps.auth_on.outcome == 'success' }}
        env:
          LOOM_AUTH_REQUIRED: "true"
          LOOM_BASE_URL: http://localhost:7778
        run: >-
          pytest -q
          tests/integration/test_cross_principal_leakage.py
          tests/integration/test_read_scope_isolation.py
          tests/integration/test_session_briefs.py
          tests/integration/test_token_mint.py
          tests/integration/test_mcp_session_run_scope.py
          tests/integration/test_onboard_tenant.py
          tests/integration/test_blacklist.py
          tests/integration/test_sensitivity_high_canary.py
          tests/integration/test_pg_authority.py
          -k "not test_a_duplicate_never_resolves_to_a_canonical_outside_the_scope
          and not test_a_superseded_hit_never_names_a_successor_outside_the_scope"
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-log-postgres-${{ matrix.postgres }}
          path: |
            server.log
            server-auth.log

  mixed-version:
    name: builds N-1 and N on one ClickHouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gate builds each build's dashboard bundle.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}" --extra dev --extra code
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # On main the base is the previous commit (HEAD~1); on a pull request, origin/main.
      - name: Mixed-version gate
        run: >-
          python scripts/gates/mixed_version.py --require
          --base ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}

  sdk-typescript:
    name: typescript sdk (generated types in sync, lint, tsc, vitest, dist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Loom from uv.lock (no extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # The SDK's operation table and wire types are generated from the
      # server's registry; a server change that alters a
      # request or response shape must regenerate them in the same PR.
      - name: generated ops.ts is current
        run: python scripts/codegen/sdk_ts_gen.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: npm ci
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund
      # biome lint + format, tsc --noEmit, version consistency, the README's
      # ts examples type-checked against src, vitest.
      - name: lint + type-check + version + README examples + unit tests
        working-directory: sdk/typescript
        run: npm run check
      # ESM + CJS build, the dist tests over the exact export
      # list, publint and arethetypeswrong — the package must resolve for
      # CommonJS consumers and bundlers before it is ever published.
      - name: build + dist tests + publint + attw
        working-directory: sdk/typescript
        run: npm run check:dist

  sdk-python-package:
    name: python sdk wheel (py ${{ matrix.python }}${{ matrix.lowest && ', lowest deps' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every other job runs the SDK inside the server's 3.12 environment, whose
    # dependencies and interpreter hide what a clean install on the SDK's floor
    # lacks. This one installs the built wheel alone, with only its declared
    # deps, on the floor and the newest Python; the lowest-deps legs pin each
    # declared dep to its lower bound.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
          - python: "3.12"
          - python: "3.14"
          - python: "3.11"
            lowest: true
          - python: "3.14"
            lowest: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv
      - name: Build wheel + sdist
        run: uv build sdk/python --out-dir dist
      - name: Install the wheel into a clean venv
        env:
          RESOLUTION: ${{ matrix.lowest && 'lowest-direct' || 'highest' }}
        run: |
          WHEEL=$(ls dist/*.whl)
          uv venv --python "$(which python)" /tmp/sdk-venv
          # The wheel's Requires-Dist lines, passed as direct requirements so
          # lowest-direct lowers them (a wheel's own deps count as transitive).
          unzip -p "$WHEEL" '*.dist-info/METADATA' | sed -n 's/^Requires-Dist: //p' > /tmp/sdk-deps.txt
          uv pip install --python /tmp/sdk-venv/bin/python --resolution "$RESOLUTION" \
            "$WHEEL" -r /tmp/sdk-deps.txt
          uv pip list --python /tmp/sdk-venv/bin/python
      - name: Smoke-test the installed wheel
        run: /tmp/sdk-venv/bin/python scripts/gates/sdk_wheel_smoke.py dist/*.whl
