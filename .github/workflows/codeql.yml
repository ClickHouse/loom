name: codeql

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.ref == 'refs/heads/ci/codeql-extended-triage'
    name: CodeQL extended (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - server/
              - sdk/typescript/src/
              - frontend/src/
            paths-ignore:
              - "**/tests/**"
              - "**/*.test.ts"
              - "**/*.test.tsx"
              - "**/*.test-d.ts"
              - frontend/src/test/**
      - id: scan
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /suite:security-extended-triage/language:${{ matrix.language }}
          upload: always
          upload-database: false
      - name: Report findings by rule
        env:
          SARIF_DIR: ${{ steps.scan.outputs.sarif-output }}
        run: |
          jq -s -r '
            [.[].runs[].results[]?] as $results
            | "Findings: \($results | length)", "",
              ($results | group_by(.ruleId)[] | "- \(.[0].ruleId): \(length)")
          ' "$SARIF_DIR"/*.sarif | tee "$RUNNER_TEMP/codeql-rule-counts.txt" >> "$GITHUB_STEP_SUMMARY"
