name: n8n community nodes

on:
  pull_request:
    paths:
      - integrations/n8n/**
      - .github/workflows/n8n-publish.yml
      - .github/pnpm/**
  push:
    tags:
      - v*
      - n8n-v*

permissions:
  contents: read

concurrency:
  group: n8n-workflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check the n8n package
    outputs:
      package_version: ${{ steps.package-version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Read the package version for publication
        id: package-version
        if: github.event_name == 'push' && (startsWith(github.ref_name, 'n8n-v') || !contains(github.ref_name, '-'))
        working-directory: integrations/n8n
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install the locked package manager
        run: |
          npm ci --prefix .github/pnpm --ignore-scripts --no-fund --no-audit
          echo "$PWD/.github/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: integrations/n8n
      - run: pnpm check
        working-directory: integrations/n8n
      - run: pnpm pack --out package.tgz
        working-directory: integrations/n8n
      - name: Load the packaged nodes without development dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/n8n-package-check/node_modules/@clickhouse/n8n-nodes-loom"
          ln -s "$GITHUB_WORKSPACE/integrations/n8n/node_modules/n8n-workflow" "$RUNNER_TEMP/n8n-package-check/node_modules/n8n-workflow"
          cd "$RUNNER_TEMP/n8n-package-check"
          tar -xzf "$GITHUB_WORKSPACE/integrations/n8n/package.tgz" --strip-components=1 -C node_modules/@clickhouse/n8n-nodes-loom
          node -e 'for (const path of ["Loom/Loom.node", "LoomMemory/LoomMemory.node"]) require("@clickhouse/n8n-nodes-loom/dist/nodes/" + path + ".js")'

  publish:
    name: Publish the n8n package
    if: github.event_name == 'push' && (startsWith(github.ref_name, 'n8n-v') || !contains(github.ref_name, '-'))
    needs: check
    concurrency:
      group: n8n-package-${{ needs.check.outputs.package_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-n8n
    env:
      VERSION: ${{ needs.check.outputs.package_version }}
    permissions:
      contents: read
      id-token: write # Authenticate trusted npm publication.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Validate the publication tag
        id: publication-tag
        working-directory: integrations/n8n
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == n8n-v* ]]; then
            [[ "$RELEASE_TAG" == "n8n-v$VERSION" ]]
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
      - name: Install the locked package manager
        run: |
          npm ci --prefix .github/pnpm --ignore-scripts --no-fund --no-audit
          echo "$PWD/.github/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: integrations/n8n
      - run: pnpm build
        working-directory: integrations/n8n
      - name: Publish using the registered npm trusted publisher
        working-directory: integrations/n8n
        run: |
          if npm view "@clickhouse/n8n-nodes-loom@$VERSION" version >/dev/null 2>&1; then
            echo "Package version is already published"
            exit 0
          fi
          npm publish --provenance --access public
