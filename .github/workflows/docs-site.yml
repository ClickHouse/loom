name: docs site

# Builds the legacy routes and publishes redirects to the documentation. After a
# deploy, submit changed documentation URLs to IndexNow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "i18n/**"
      - "mkdocs.yml"
      - "llms.txt"
      - "llms-install.md"
      - "scripts/docs_site/**"
      - "scripts/codegen/page_summary.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # Read the base URL used by the legacy Markdown copies.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the site builder
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/docs_site/requirements.txt
      - if: github.ref == 'refs/heads/main' && vars.DOCS_SITE_ENABLED == 'true'
        name: Read the legacy Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        env:
          LOOM_LEGACY_DOCS_URL: ${{ steps.pages.outputs.base_url || 'https://loom.clickhouse.com/docs' }}/
        run: mkdocs build --strict
      - name: Redirect GitHub Pages to the documentation
        run: python -m scripts.docs_site.redirect_pages site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && vars.DOCS_SITE_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Deploy the built Pages artifact.
      id-token: write # Authenticate the Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: indexnow
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A failed submission only delays indexing; it must not mark the deploy failed.
    continue-on-error: true
    permissions:
      contents: read
      actions: read # to find the last successful run, below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Submit the pages changed since the last successful run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A push can carry several commits, and a pending run can be cancelled by a newer
          # one, so diff from the last successful run on main. Fall back to HEAD~1 when
          # there is none or it isn't an ancestor of HEAD. A run counts as successful even
          # when its submission failed or the deploy was off, and those pages aren't resent.
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow docs-site.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD; then base=HEAD~1; fi
          routes=docs/scripts/public-pages.json
          args=()
          if git cat-file -e "$base:$routes" 2>/dev/null; then
            previous_routes="$RUNNER_TEMP/indexnow-previous-public-pages.json"
            git show "$base:$routes" > "$previous_routes"
            args=(--previous-public-pages "$previous_routes")
          fi
          git diff -z --name-only --no-renames "$base" HEAD | xargs -0 python scripts/docs_site/indexnow.py "${args[@]}" --
