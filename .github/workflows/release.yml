name: release

# A `v*` tag push builds and verifies the release files and attaches them to a
# GitHub Release; nothing leaves GitHub. A manual dispatch on the same tag
# (`gh workflow run release.yml --ref vX.Y.Z`) runs the same jobs, building no
# image the tag run published, and then
# publishes the verified SDK files to PyPI and npm and lists the server in the
# MCP Registry. Every tag publishes the server and extractor images to ghcr.io
# before making the GitHub Release visible, so the release's one-line installer
# never points at an image that does not exist. A dispatch with `dry_run` on any
# branch runs every build, check and smoke test and publishes nothing.
# docs/development/release-process.md is the maintainer procedure.
#
# Jobs: version (derive and gate the version) -> preflight (the owner-granted
# prerequisites, in seconds) -> clickhouse (the ClickHouse release the
# installer bundle names, migrated and schema-checked) -> build -> verify
# (inspect the exact files) -> docker (build and scan each image on each
# architecture's own runner) -> docker-tag -> docker-smoke -> github-release ->
# pypi, npm, mcp-registry (dispatch only). A re-run after a partial publish is
# safe: the bundle keeps the ClickHouse release it was first published with,
# the release is updated in place, PyPI skips files it already has, npm and the
# MCP Registry skip a version they already have, a re-run of failed jobs tags
# the same build again, and a run on a tag whose images are published builds
# and tags none.
#
# The PyPI, npm and MCP Registry jobs are dispatch-only, so a tag's GitHub
# Release can be checked before the SDKs and the server listing reach the
# registries.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse on any branch: build, verify and smoke-test everything, and
          publish nothing (no image push, GitHub Release or registry upload)
        type: boolean
        required: false
        default: false
      clickhouse_image:
        description: >-
          An exact ClickHouse release for a bundle not yet published (e.g.
          clickhouse/clickhouse-server:26.9.18.11), when `latest` names a bad one
        required: false
        default: ""
      allow_clickhouse_downgrade:
        description: >-
          Publish a bundle whose ClickHouse release is older than one a recent
          published bundle names (installs that upgrade then run an older
          server on data a newer one wrote)
        type: boolean
        required: false
        default: false

# One release run per tag at a time; a second run waits instead of cancelling
# a publish halfway.
concurrency:
  group: release-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.12.19"

jobs:
  version:
    name: Version from the tag or the server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A dispatch from a branch would otherwise take the branch name as the
      # version and publish it. A dry run publishes nothing, so it runs on any
      # ref, at the version the server names.
      - name: Parse the version from the tag or the server
        id: parse
        env:
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          case "$REF" in
            refs/tags/v*) VERSION="${REF#refs/tags/v}" ;;
            *)
              if [ "$DRY_RUN" != true ]; then
                echo "::error::run the release on a v* tag, not $REF (or dispatch it with -f dry_run=true)"
                exit 1
              fi
              VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' server/__init__.py)
              ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a SemVer X.Y.Z[-pre] version"
            exit 1
          fi
          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (prerelease: $PRERELEASE, dry run: $DRY_RUN)"
      # The server reports its version from server/__init__.py (= pyproject.toml);
      # a tag that disagrees would ship an image that names another release.
      # The mcp-registry job publishes server.json as committed, so it must agree too.
      - name: The server's version names the release
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          grep -qxF "__version__ = \"$VERSION\"" server/__init__.py \
            || { echo "::error file=server/__init__.py::__version__ is not $VERSION"; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v' server.json >/dev/null \
            || { echo "::error file=server.json::version is not $VERSION"; exit 1; }

  # What only an owner can grant (a public repository; ghcr.io packages this
  # workflow can push and anyone can pull), checked before the builds rather
  # than at the push. A dry run reports each as a warning.
  preflight:
    name: Release prerequisites
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images_published: ${{ steps.images.outputs.published }}
    env:
      # Every image the docker matrix builds (a unit test keeps the two equal).
      IMAGES: ghcr.io/clickhouse/loom ghcr.io/clickhouse/loom-extractor
    permissions:
      contents: read
      packages: write # the push probe asks for the access the docker job uses
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the owner-granted prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          MODE: ${{ inputs.dry_run && 'report' || 'strict' }}
        run: bash scripts/release/preflight.sh "$MODE"
      # The registry dispatch on a tag whose images the tag run published keeps
      # them: an uncached rebuild would move the version's tags onto other bytes.
      - name: Are this version's images published
        id: images
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          # shellcheck disable=SC2086 # one argument per image
          published=$(bash scripts/release/published_images.sh "$VERSION" $IMAGES)
          echo "published=$published" >> "$GITHUB_OUTPUT"

  # The bundle names the ClickHouse release that is latest now, so an installed
  # Loom version keeps its ClickHouse; it is migrated and checked here first.
  clickhouse:
    name: The ClickHouse release the bundle names
    needs: [version, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    env:
      LOOM_CH_HOST: localhost
      LOOM_CH_PORT: "8123"
      LOOM_CH_USER: loom
      LOOM_CH_PASSWORD: loomdev
      LOOM_CH_DATABASE: loom
      LOOM_CH_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Loom from uv.lock (no extras)
        run: |
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # A re-run keeps the release this version's published bundle names, so
      # rerunning the installer for it never moves ClickHouse.
      # A dispatch may name the release in place of `latest`; a published
      # bundle keeps its own either way. A downgrade is refused here so the
      # run stops before it builds and pushes images; github-release checks
      # again before it uploads.
      - id: resolve
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          CLICKHOUSE_IMAGE: ${{ inputs.clickhouse_image }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_clickhouse_downgrade }}
        run: |
          if [ -n "$CLICKHOUSE_IMAGE" ]; then
            python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/release")
          from build_stack_bundle import EXACT_CLICKHOUSE
          image = os.environ["CLICKHOUSE_IMAGE"]
          if not EXACT_CLICKHOUSE.fullmatch(image):
              sys.exit(f"::error::not one ClickHouse release: {image!r}")
          PY
          fi
          status=0
          bash scripts/release/published_bundle.sh "$VERSION" published || status=$?
          case $status in
            0)
              image=$(python scripts/release/build_stack_bundle.py pinned-in published/loom-stack.tar.gz)
              if [ -n "$CLICKHOUSE_IMAGE" ] && [ "$CLICKHOUSE_IMAGE" != "$image" ]; then
                echo "::warning::clickhouse_image=$CLICKHOUSE_IMAGE ignored: v$VERSION's published bundle names $image"
              fi
              ;;
            3)
              if [ -n "$CLICKHOUSE_IMAGE" ]; then
                image=$CLICKHOUSE_IMAGE
              else
                image=$(bash dev/clickhouse_release.sh)
              fi
              bash scripts/release/refuse_downgrade.sh "$image"
              ;;
            *) exit "$status" ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Migrate a fresh server of that release and check schema.sql
        env:
          LOOM_CLICKHOUSE_IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          bash dev/ci_start_clickhouse.sh
          python -m server.core.schema.migrate
          make schema-check

  build:
    name: Build the release files
    needs: [version, clickhouse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The SDK sources carry the tag's version, so every published file names it.
      # check-version.mjs compares package.json, package-lock.json (npm version
      # rewrites both) and src/version.ts.
      - name: Sync SDK versions to the tag
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          p = pathlib.Path("sdk/python/pyproject.toml")
          p.write_text(re.sub(r'^version = ".*"$', f'version = "{version}"', p.read_text(), count=1, flags=re.M))
          v = pathlib.Path("sdk/python/loom/_version.py")
          v.write_text(re.sub(r'__version__ = ".*"', f'__version__ = "{version}"', v.read_text()))
          PY
          cd sdk/typescript
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          sed -i "s/export const SDK_VERSION = \".*\";/export const SDK_VERSION = \"$VERSION\";/" src/version.ts
      - name: Build Python sdist + wheel
        run: |
          pip install build==1.6.1
          python -m build sdk/python --outdir release/python
      - name: npm ci
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund
      # Lint, types, version across sources, README examples and unit tests
      # gate a registry publish.
      - name: npm run check (before a registry publish)
        if: github.event_name == 'workflow_dispatch'
        working-directory: sdk/typescript
        run: npm run check
      # ESM + CJS build, dist tests, publint and arethetypeswrong.
      - name: Build the npm tarball
        working-directory: sdk/typescript
        run: |
          npm run check:dist
          mkdir -p ../../release/npm
          npm pack --pack-destination ../../release/npm
      - name: Zip the coding-agent plugins
        run: |
          mkdir -p release/plugins
          ( cd integrations && zip -qr "../release/plugins/loom-claude-code-plugin-v${VERSION}.zip" claude-code-plugin -x "claude-code-plugin/tests/*" )
          ( cd integrations && zip -qr "../release/plugins/loom-codex-plugin-v${VERSION}.zip" codex-plugin )
          zip -q "release/plugins/loom-claude-code-plugin-v${VERSION}.zip" LICENSE NOTICE THIRD_PARTY_NOTICES
          zip -q "release/plugins/loom-codex-plugin-v${VERSION}.zip" LICENSE NOTICE THIRD_PARTY_NOTICES
          ls -la release/*
      - name: Build the source-free Compose installer bundle
        env:
          CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
        run: |
          python scripts/release/build_stack_bundle.py build --version "$VERSION" \
            --clickhouse-image "$CLICKHOUSE_IMAGE"
          cp install.sh release/stack/install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  verify:
    name: Verify the release files
    needs: [version, clickhouse, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      # Names, embedded versions and contents of exactly the files that are
      # attached and published: one wheel and one sdist, one npm tarball, two
      # plugin zips without tests and with the executable bits git records.
      - name: Files carry this version and the expected contents
        run: |
          pip install packaging==26.3
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, tarfile, zipfile
          from packaging.version import Version

          sys.path.insert(0, os.getcwd())
          from scripts.release.build_stack_bundle import FILES, pinned_image

          version = os.environ["VERSION"]
          pyv = str(Version(version))
          errors = []

          def names(d):
              return sorted(p.name for p in pathlib.Path("release", d).iterdir())

          py = names("python")
          want = [f"clickhouse_loom-{pyv}-py3-none-any.whl", f"clickhouse_loom-{pyv}.tar.gz"]
          if sorted(py) != sorted(want):
              errors.append(f"python files {py}, expected {want}")
          else:
              with zipfile.ZipFile(f"release/python/{want[0]}") as z:
                  meta = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
                  text = z.read(meta).decode()
                  if f"\nVersion: {pyv}\n" not in text or "\nName: clickhouse-loom\n" not in text:
                      errors.append("wheel METADATA does not name clickhouse-loom " + pyv)

          npm = names("npm")
          tgz = f"clickhouse-loom-{version}.tgz"
          if npm != [tgz]:
              errors.append(f"npm files {npm}, expected [{tgz}]")
          else:
              with tarfile.open(f"release/npm/{tgz}") as t:
                  pkg = json.load(t.extractfile("package/package.json"))
                  if (pkg["name"], pkg["version"]) != ("@clickhouse/loom", version):
                      errors.append(f"npm package.json names {pkg['name']}@{pkg['version']}")
                  if not any(n.startswith("package/dist/") for n in t.getnames()):
                      errors.append("npm tarball has no dist/")

          for plugin, manifest, excluded in (
              ("claude-code-plugin", ".claude-plugin/plugin.json", "tests/"),
              ("codex-plugin", ".codex-plugin/plugin.json", None),
          ):
              path = f"release/plugins/loom-{plugin}-v{version}.zip"
              if not os.path.exists(path):
                  errors.append(f"missing {path}")
                  continue
              with zipfile.ZipFile(path) as z:
                  info = {i.filename: i for i in z.infolist()}
              if f"{plugin}/{manifest}" not in info:
                  errors.append(f"{path} has no {manifest}")
              for required_notice in ("LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"):
                  if required_notice not in info:
                      errors.append(f"{path} has no {required_notice}")
              if excluded and any(n.startswith(f"{plugin}/{excluded}") for n in info):
                  errors.append(f"{path} ships {excluded}")
              staged = subprocess.run(
                  ["git", "ls-files", "-s", f"integrations/{plugin}"],
                  check=True, capture_output=True, text=True,
              ).stdout.splitlines()
              for line in staged:
                  mode, _, _, name = line.split(maxsplit=3)
                  entry = info.get(name.removeprefix("integrations/"))
                  if mode == "100755" and entry and not (entry.external_attr >> 16) & 0o111:
                      errors.append(f"{entry.filename} lost its executable bit")
          if len(names("plugins")) != 2:
              errors.append(f"plugin files {names('plugins')}, expected two zips")

          stack = names("stack")
          expected_stack = ["install.sh", "loom-stack.tar.gz", "loom-stack.tar.gz.sha256"]
          if stack != expected_stack:
              errors.append(f"stack files {stack}, expected {expected_stack}")
          else:
              archive = pathlib.Path("release/stack/loom-stack.tar.gz")
              checksum = pathlib.Path("release/stack/loom-stack.tar.gz.sha256").read_text().split()[0]
              import hashlib
              if hashlib.sha256(archive.read_bytes()).hexdigest() != checksum:
                  errors.append("stack bundle sha256 does not match")
              with tarfile.open(archive) as t:
                  # Every file the builder ships, so the two cannot drift apart.
                  required = {"loom-stack/VERSION"} | {f"loom-stack/{d}" for d in FILES.values()}
                  missing = required - set(t.getnames())
                  if missing:
                      errors.append(f"stack bundle is missing {sorted(missing)}")
                  release_version = t.extractfile("loom-stack/VERSION").read().decode().strip()
                  pinned = pinned_image(archive)
                  if pinned != os.environ["CLICKHOUSE_IMAGE"]:
                      errors.append(f"stack bundle names {pinned}, not the checked release")
                  if release_version != version:
                      errors.append(f"stack bundle version {release_version}, expected {version}")

          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY
      # The wheel alone in a clean venv: it imports, talks through a mocked
      # transport, and ships py.typed and the license.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/sdk-smoke
          /tmp/sdk-smoke/bin/pip install release/python/*.whl
          /tmp/sdk-smoke/bin/python scripts/gates/sdk_wheel_smoke.py release/python/*.whl

  docker:
    # The server's image, and the document extractor service's (extractor/), which
    # the compose stack and the chart run beside it at the same version. Each
    # architecture builds on its own runner, is pushed by digest and scanned;
    # docker-tag joins the two. None is built when the version's are published.
    # A dry run exports each image to an artifact instead of pushing it, without
    # the provenance and SBOM attestations, which only a registry keeps.
    name: Docker (${{ matrix.artifact }}, ${{ matrix.arch }})
    if: ${{ needs.preflight.outputs.images_published != 'true' }}
    needs: [version, preflight, verify]
    strategy:
      # A dry run reports every image's failure; a release stops at the first.
      fail-fast: ${{ !inputs.dry_run }}
      matrix:
        artifact: [server, extractor]
        arch: [amd64, arm64]
        include:
          - artifact: server
            image: ghcr.io/clickhouse/loom
            file: Dockerfile
            pin: image.digest
            # The repository's title and description, metadata-action's defaults.
            labels: ""
          - artifact: extractor
            image: ghcr.io/clickhouse/loom-extractor
            file: extractor/Dockerfile
            pin: extractor.image.digest
            labels: |
              org.opencontainers.image.title=loom-extractor
              org.opencontainers.image.description=Loom's document extractor service, which parses originals apart from the server
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          # The extractor's own title and description; the defaults are the repository's.
          labels: ${{ matrix.labels }}
          # docker-tag adds `:latest` when this is the highest final version;
          # metadata-action would add it to any final version.
          flavor: latest=false
          # A dry run on a branch has no tag to derive them from.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
      - name: Build + push by digest (linux/${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          # By digest only: docker-tag adds the version tags once every image has scanned.
          # A dry run's goes to a file instead, which docker-smoke loads.
          outputs: ${{ inputs.dry_run && format('type=docker,name={0}:{1},dest={2}/image.tar', matrix.image, needs.version.outputs.version, runner.temp) || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', matrix.image) }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ !inputs.dry_run && 'mode=max' || 'false' }}
          sbom: ${{ !inputs.dry_run }}
          # Built from the package archives as they are now: a cached apt layer
          # would ship, or fail the scan on, a package fixed since it was cached.
          no-cache: true
      # Fails the release on a critical CVE that has a fixed package.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ !inputs.dry_run && format('{0}@{1}', matrix.image, steps.build.outputs.digest) || '' }}
          input: ${{ inputs.dry_run && format('{0}/image.tar', runner.temp) || '' }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Tagged by docker-tag, which waits for every image to scan.
      - name: Record the scanned image, digest and tags
        env:
          IMAGE: ${{ matrix.image }}
          PIN: ${{ matrix.pin }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mkdir -p scanned
          printf '%s\n' "$IMAGE" > scanned/image
          printf '%s\n' "$PIN" > scanned/pin
          printf '%s\n' "$DIGEST" > scanned/digest
          printf '%s\n' "$TAGS" > scanned/tags
          if [ "$DRY_RUN" = true ]; then mv "$RUNNER_TEMP/image.tar" scanned/image.tar; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanned-${{ matrix.artifact }}-${{ matrix.arch }}
          path: scanned/
          retention-days: ${{ inputs.dry_run && 1 || 0 }} # 0: the repository's default
          compression-level: ${{ inputs.dry_run && 1 || 6 }}

  docker-tag:
    name: Tag every scanned image
    if: ${{ !inputs.dry_run && needs.preflight.outputs.images_published != 'true' }}
    needs: [version, preflight, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Asked when it is applied, so a re-run never moves Latest back (make_latest.py).
      - name: Is this the highest final version
        id: latest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        # An assignment, so a failed listing fails the step (an echo of it would not).
        run: |
          latest=$(python3 scripts/release/make_latest.py "$VERSION")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scanned-*
      # No image is tagged until every one has scanned: each image's tags name
      # one index of its amd64 and arm64 digests. A failure here can leave one
      # image tagged and not the other; re-running this job tags both again.
      - name: Tag the scanned images
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -- scanned-*/
          [ "$#" = 4 ] || { echo "::error::expected the server's and the extractor's scans on amd64 and arm64, got: $*"; exit 1; }
          for artifact in server extractor; do
            set -- scanned-"$artifact"-*/
            image=$(cat "$1image") pin=$(cat "$1pin")
            version_tag=$(head -n 1 "$1tags")
            args=()
            while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <"$1tags"
            [ "$LATEST" != true ] || args+=(-t "$image:latest")
            sources=()
            for dir in "$@"; do sources+=("$image@$(cat "${dir}digest")"); done
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
            # jq -e: a failed inspect leaves no digest, which fails the step, never an empty pin.
            digest=$(docker buildx imagetools inspect "$version_tag" --format '{{json .Manifest}}' | jq -re .digest)
            echo "Pin $image with \`$pin: $digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  docker-smoke:
    name: Released quickstart (${{ matrix.arch }})
    # A dry run smokes the images its docker jobs exported, a release the ones
    # docker-tag published, and a dispatch on a published tag the published ones.
    if: >-
      ${{ !cancelled() && needs.clickhouse.result == 'success' && needs.verify.result == 'success' && (
      (needs.docker.result == 'success' && needs.docker-tag.result == 'success') ||
      (inputs.dry_run && needs.docker.result == 'success' && needs.docker-tag.result == 'skipped') ||
      needs.preflight.outputs.images_published == 'true') }}
    needs: [version, preflight, clickhouse, verify, docker, docker-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dashboard browser-test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Load this run's images (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scanned-*-${{ matrix.arch }}
      - name: Load this run's images into Docker (dry run)
        if: ${{ inputs.dry_run }}
        run: for tar in scanned-*/image.tar; do docker load -i "$tar"; done
      - name: Fresh installer stack, compiler indexing and dashboard provider recovery
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CLICKHOUSE_IMAGE: ${{ needs.clickhouse.outputs.image }}
        run: |
          python3 scripts/gates/docker_quickstart_smoke.py --image "ghcr.io/clickhouse/loom:$VERSION" \
            --extractor-image "ghcr.io/clickhouse/loom-extractor:$VERSION" \
            --clickhouse-image "$CLICKHOUSE_IMAGE"

  github-release:
    name: GitHub Release (artifacts attached)
    if: ${{ !cancelled() && !inputs.dry_run && needs.verify.result == 'success' && needs.docker-smoke.result == 'success' && (needs.docker-tag.result == 'success' || needs.preflight.outputs.images_published == 'true') }}
    needs: [version, preflight, verify, docker-tag, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish at a time across every tag, so the downgrade check below
    # sees the bundle another tag's run published a moment ago.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      # Asked when it is applied, so a re-run never moves Latest back (make_latest.py).
      - name: Is this the highest final version
        id: latest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        # An assignment, so a failed listing fails the step (an echo of it would not).
        run: |
          latest=$(python3 scripts/release/make_latest.py "$VERSION")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      # Replacing an asset deletes it first: a failed upload would leave an
      # installed version without its bundle, and its pin with it. A published
      # bundle and its checksum stay; a checksum file the release lost is
      # written again from the published bundle. A new bundle never names an
      # older ClickHouse release than a recent published one (prereleases
      # included), unless the dispatch allows it.
      - name: Keep this version's published bundle, or refuse a ClickHouse downgrade
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_clickhouse_downgrade }}
        run: |
          status=0
          bash scripts/release/published_bundle.sh "$VERSION" published || status=$?
          case $status in
            0)
              rm release/stack/loom-stack.tar.gz release/stack/loom-stack.tar.gz.sha256
              if [ -f published/loom-stack.tar.gz.sha256 ]; then
                (cd published && sha256sum -c loom-stack.tar.gz.sha256)
              else
                (cd published && sha256sum loom-stack.tar.gz) >release/stack/loom-stack.tar.gz.sha256
              fi
              ;;
            3)
              image=$(python3 scripts/release/build_stack_bundle.py pinned-in release/stack/loom-stack.tar.gz)
              bash scripts/release/refuse_downgrade.sh "$image"
              ;;
            *) exit "$status" ;;
          esac
      # Notes are generated only when this run creates the release: on an existing
      # one the action appends them again, under notes edited by hand.
      - name: Is there a release for this tag already
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        # Only a 404 means there is none: any other failure would regenerate the notes.
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1); then
            echo "release=true" >>"$GITHUB_OUTPUT"
          elif grep -q "(HTTP 404)" <<<"$out"; then
            echo "release=false" >>"$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            echo "::error::could not tell whether $GITHUB_REF_NAME has a release"
            exit 1
          fi
      # An existing release for the tag is updated and its other files replaced,
      # so a re-run or the later dispatch leaves the published bytes attached.
      - name: Create or update the release with notes and files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: ${{ steps.existing.outputs.release != 'true' }} # from the commits since the previous tag
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.latest }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/python/*
            release/npm/*.tgz
            release/plugins/*.zip
            release/stack/*

  pypi:
    name: PyPI (clickhouse-loom)
    # !cancelled(): an implicit success() would read the docker jobs a dispatch on
    # a published tag skips, and skip this one too.
    if: ${{ !cancelled() && needs.github-release.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/clickhouse-loom
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Publish the verified wheel and sdist (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/python/
          skip-existing: true

  npm:
    name: npm (@clickhouse/loom)
    # !cancelled(): as in the pypi job.
    if: ${{ !cancelled() && needs.github-release.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@clickhouse/loom
    permissions:
      id-token: write # npm provenance; trusted publishing once registered on npmjs.com
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      # A prerelease goes to the `next` dist-tag so `npm install` keeps the
      # last stable version.
      - name: Publish the verified tarball (provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback while trusted publishing is not registered
        run: |
          if npm view "@clickhouse/loom@$VERSION" version >/dev/null 2>&1; then
            echo "@clickhouse/loom@$VERSION is already published"
            exit 0
          fi
          TAG=latest
          [ "$PRERELEASE" = true ] && TAG=next
          npm publish "release/npm/clickhouse-loom-$VERSION.tgz" --provenance --access public --tag "$TAG"

  mcp-registry:
    name: MCP Registry (io.github.ClickHouse/loom)
    # A prerelease is not listed. The listing links the repository and its
    # icon, which preflight has checked are public.
    if: ${{ !cancelled() && needs.github-release.result == 'success' && github.event_name == 'workflow_dispatch' && !inputs.dry_run && needs.version.outputs.prerelease != 'true' }}
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.ClickHouse/loom
    permissions:
      contents: read
      id-token: write # registry login for the io.github.ClickHouse namespace (OIDC)
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISHER_VERSION: "1.8.1"
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry refuses a version it already lists, so a re-run stops here.
      # `search` matches a substring, so the name and version are compared exactly.
      - name: Publish server.json
        shell: bash
        run: |
          listed=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.ClickHouse/loom&version=$VERSION" \
            | jq --arg n io.github.ClickHouse/loom --arg v "$VERSION" \
              '[.servers[] | select(.server.name == $n and .server.version == $v)] | length')
          if [ "$listed" -ne 0 ]; then
            echo "io.github.ClickHouse/loom $VERSION is already listed"
            exit 0
          fi
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
