name: translations

# Keeps i18n/<lang>/ in step with the English pages it translates. On a push to main that
# changes a translated page (or the generator), and on a manual run, it translates the
# stale pages with scripts/i18n/translate.py and opens or updates one pull request from the
# branch i18n/update. Needs the repository secret ANTHROPIC_API_KEY and "Allow GitHub
# Actions to create and approve pull requests" (Settings → Actions → General). A pull
# request opened with the workflow token starts no other workflow: close and reopen it to
# run CI.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/getting-started/quickstart.md"
      - "docs/use-cases/**"
      - "scripts/i18n/**"
      - ".github/workflows/i18n.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Find stale translations
        id: check
        run: |
          if python -m scripts.i18n.translate check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Translate
        if: steps.check.outputs.stale == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOM_I18N_MAX_USD: "5"
        run: python -m scripts.i18n.translate update | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Open or update the pull request
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C i18n/update
          git add README.md i18n
          git commit -s -q -m "Translations follow ${SOURCE_SHA::9}"
          git push --force origin i18n/update
          if [ -z "$(gh pr list --head i18n/update --state open --json number --jq '.[].number')" ]; then
            gh pr create --head i18n/update --base main \
              --title "Translations follow ${SOURCE_SHA::9}" \
              --body "Machine translations of the pages changed up to ${SOURCE_SHA}, generated by \`scripts/i18n/translate.py\`. Close and reopen this pull request to run CI."
          else
            gh pr edit i18n/update --title "Translations follow ${SOURCE_SHA::9}"
          fi
