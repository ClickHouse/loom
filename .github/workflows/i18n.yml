name: translations

# Keeps i18n/<lang>/ in step with the English pages it translates. On a push to main that
# changes the README or a page under docs/, and on a manual run, it translates the stale
# pages with scripts/i18n/translate.py and opens or updates one pull request from the
# branch i18n/update. After a change to the prompt, a banner or the model, run it by hand
# with "all" to translate every page again. A pull request opened with the workflow token
# starts no other workflow: close and reopen it to run CI. Needs "Allow GitHub Actions to
# create and approve pull requests" (Settings → Actions → General).
#
# Claude is called on Amazon Bedrock with no credential stored in GitHub: the job runs on a
# self-hosted runner in AWS whose instance role may invoke one model, and the SDK signs with
# that role. The repository variable LOOM_I18N_RUNNER holds the runner's labels as JSON;
# while it is empty the job is skipped. Only a push to main or a manual run reaches the
# runner, never a pull request. The runner group and the role are described in
# CONTRIBUTING.md#translations.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      all:
        description: Translate every page, stale or not
        type: boolean
        default: false
      languages:
        description: Language codes to translate, separated by spaces (empty for all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: update
    if: github.ref == 'refs/heads/main' && vars.LOOM_I18N_RUNNER != ''
    runs-on: ${{ fromJSON(vars.LOOM_I18N_RUNNER) }}
    timeout-minutes: 45
    # Limited to main (Settings → Environments); it records each run. What keeps other
    # workflows off the runner is the runner group's selected-workflow rule.
    environment: i18n
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        # Explicit bash runs with -o pipefail, so a failed translation fails its step.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Find stale translations
        id: check
        env:
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" != "true" ] && python -m scripts.i18n.translate check; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the Bedrock client
        if: steps.check.outputs.stale == 'true'
        # A virtualenv in the job's temp directory: a self-hosted runner keeps its Python.
        run: |
          python -m venv "$RUNNER_TEMP/i18n"
          "$RUNNER_TEMP/i18n/bin/python" -m pip install --quiet --require-hashes --no-deps \
            --only-binary=:all: -r scripts/i18n/requirements.txt
          echo "$RUNNER_TEMP/i18n/bin" >> "$GITHUB_PATH"
      - name: Translate
        id: translate
        if: steps.check.outputs.stale == 'true'
        env:
          LOOM_I18N_MAX_USD: "5"
          ALL: ${{ inputs.all && '--all' || '' }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          # The runner's region, or us-east-1 when it sets none; the role's policy names it.
          export AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}"
          args=($ALL)
          for code in $LANGUAGES; do args+=(--lang "$code"); done
          if python -m scripts.i18n.translate update "${args[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          # The pages written passed the verifier; links, anchors and labels across i18n/
          # must hold before anything is pushed.
          python -m scripts.i18n.translate check --skip-stale
      - name: Open or update the pull request
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C i18n/update
          git add README.md i18n
          if git diff --cached --quiet; then
            echo "no page was translated"
            exit 0
          fi
          git commit -s -q -m "Translations follow ${SOURCE_SHA::9}"
          git push --force origin i18n/update
          title="Translations follow ${SOURCE_SHA::9}"
          body="Machine translations of the pages changed up to ${SOURCE_SHA}, generated by \`scripts/i18n/translate.py\`. Close and reopen this pull request to run CI."
          if [ -z "$(gh pr list --head i18n/update --state open --json number --jq '.[].number')" ]; then
            gh pr create --head i18n/update --base main --title "$title" --body "$body"
          else
            gh pr edit i18n/update --title "$title" --body "$body"
          fi
      - name: Fail when a page was not translated
        if: steps.translate.outputs.ok == 'false'
        run: |
          echo "some pages failed; the pull request carries the ones that passed"
          exit 1
