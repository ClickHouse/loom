name: Performance issue
description: An op, a worker or the index is slower, or uses more ClickHouse resources, than expected.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        > [Performance tuning](https://github.com/ClickHouse/loom/blob/main/docs/guides/performance-tuning.md) covers the settings that matter most.
        > **Never paste tokens, API keys, JWTs, passwords or customer data.** `loom report` output is safe to paste: it records only whether each secret is set.
        > A security issue goes to security@clickhouse.com, not here ([SECURITY.md](https://github.com/ClickHouse/loom/blob/main/SECURITY.md)).
  - type: textarea
    attributes:
      label: Company or project name
      description: Optional. Put your company name or project description here.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Memory and search
        - Knowledge (documents)
        - Conversations, sessions and runs
        - Code index
        - Tracker
        - Namespaces, tokens and grants
        - MCP server
        - Agent plugin (Claude Code, Codex, Cursor)
        - Python SDK
        - TypeScript SDK
        - CLI
        - Dashboard
        - Background workers
        - Migrations and schema
        - Deployment and installation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: Describe the situation
      description: What is slow, with numbers (latency per call, p50 and p95, worker lag, bytes read), and the data size involved (rows in the namespace, indexed repository size).
    validations:
      required: true
  - type: dropdown
    id: latest
    attributes:
      label: Does it reproduce on the latest release or `main`?
      description: "[Releases](https://github.com/ClickHouse/loom/releases)"
      options:
        - "Yes"
        - "No, only on an older version"
        - "Not checked"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        * the calls that are slow, with their inputs
        * non-default settings (`LOOM_*` variables)
        * for the ClickHouse side, the matching `system.query_log` rows: `query_duration_ms`, `read_rows`, `read_bytes`, `memory_usage` and the query text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected performance
      description: What you expected and why it is realistic. Was it faster on an earlier Loom or ClickHouse version?
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `loom report` (or `loom report --open`, which fills this in). Otherwise give the Loom version (`loom --version`), ClickHouse version (`SELECT version()`) and where it runs (bundled, self-managed or ClickHouse Cloud), the SDK or plugin version and agent host, and the LLM and embedding providers.
      render: text
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues and pull requests
      description: |
        Full GitHub URLs, one relationship per line.
        * If a pull request caused this (a regression): `Caused by: <full pull request URL>`
        * For any related issue or pull request: `Related: <full URL>`
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Anything else about the problem.
    validations:
      required: false
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I removed tokens, keys, passwords and personal or customer data from everything above.
          required: true
