name: Upgrade or compatibility issue
description: An upgrade broke a client, a migration failed, or an op, field or setting changed behaviour.
labels: ["backward compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        > (you don't have to strictly follow this form)
        > Check the release notes of every version you skipped, and [upgrades](https://github.com/ClickHouse/loom/blob/main/docs/operations/upgrades.md), first.
        > **Never paste tokens, API keys, JWTs, passwords or customer data.** `loom report` output is safe to paste: it records only whether each secret is set.
        > A security issue goes to security@clickhouse.com, not here ([SECURITY.md](https://github.com/ClickHouse/loom/blob/main/SECURITY.md)).
  - type: textarea
    attributes:
      label: Company or project name
      description: Optional. Put your company name or project description here.
    validations:
      required: false
  - type: textarea
    id: what-broke
    attributes:
      label: Describe the unexpected behaviour
      description: What worked before and what happens now. Name the op, field, setting, SDK method or plugin hook.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The Loom version you upgraded from and to, e.g. v1.2.0 → v1.3.0. Add the SDK or plugin versions if a client broke.
    validations:
      required: true
  - type: textarea
    id: migrations
    attributes:
      label: Migration state
      description: "The output of `SELECT filename, applied_at FROM loom._migrations ORDER BY filename DESC LIMIT 5`, and the migration's error if one failed."
      render: text
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message and logs
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `loom report` (or `loom report --open`, which fills this in). Otherwise give the Loom version (`loom --version`), ClickHouse version (`SELECT version()`) and where it runs (bundled, self-managed or ClickHouse Cloud), the SDK or plugin version and agent host, and the LLM and embedding providers.
      render: text
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues and pull requests
      description: |
        Full GitHub URLs, one relationship per line.
        * If a pull request caused this (a regression): `Caused by: <full pull request URL>`
        * For any related issue or pull request: `Related: <full URL>`
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Anything else about the problem.
    validations:
      required: false
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I removed tokens, keys, passwords and personal or customer data from everything above.
          required: true
