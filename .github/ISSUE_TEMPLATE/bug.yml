name: Bug report
description: A wire op, SDK call, CLI command, worker, migration or plugin hook misbehaves.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste tokens, API keys, JWTs, passwords or customer data**, in any field. `loom report` output is safe to paste: it records only whether each secret is set.
        A security issue goes to security@clickhouse.com, not here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran (op, SDK call, `loom` or `make` command, plugin hook) and what came back. Include the `error.code` if the wire returned one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it, as commands or a short Python, TypeScript or curl snippet. If it depends on stored state, say which rows and the latest applied migration (`SELECT max(filename) FROM loom._migrations`).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `loom report`, or give the Loom version (release tag or commit), ClickHouse version (`SELECT version()`), deployment (self-hosted or ClickHouse Cloud), the SDK or plugin version and host (Claude Code, Codex, Cursor), and the LLM and embedding providers if relevant.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from the server, the worker, the plugin or the test run.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I removed tokens, keys, passwords and personal or customer data from everything above.
          required: true
