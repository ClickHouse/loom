[project]
name = "clickhouse-loom"
version = "1.2.0"
description = "Python SDK for ClickHouse Loom, a self-hosted server that gives AI agents shared long-term memory, document search and a code index."
requires-python = ">=3.11"
license = "Apache-2.0"
# A copy of the repository LICENSE: hatch cannot reach files above this directory.
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "ClickHouse, Inc." }]
keywords = [
  "loom",
  "clickhouse",
  "mcp",
  "agent-memory",
  "long-term-memory",
  "ai-agents",
  "document-search",
  "code-search",
  "rag",
  "knowledge-base",
  "llm",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

# SDK-only deps. The server (which has its own much larger dep set
# including FastAPI, uvicorn, langfuse, opentelemetry-*, clickhouse-
# connect, ...) is shipped as a Docker image at ghcr.io/clickhouse/loom.
# This package is the client SDK only — for application developers
# writing agent code against an operator-deployed Loom.
# The transport opens an httpx client with http2=True (transport.py), which
# requires the `h2` package — pulled via the httpx[http2] extra. Declaring
# plain httpx lets a clean install crash on first request (the repo's own
# venv masks it: server deps pull h2 transitively).
dependencies = ["httpx[http2]>=0.27"]

[project.optional-dependencies]
# A bot that proves a key (loom.machine) signs its client assertion with these.
machine = ["pyjwt[crypto]>=2.8"]
# The same, with the key read from AWS Secrets Manager (LOOM_CLIENT_KEY_SECRET).
aws = ["pyjwt[crypto]>=2.8", "boto3>=1.28"]
# The framework an adapter in loom.integrations subclasses; the LangGraph and
# Strands adapters need none (structural twins).
langchain = ["langchain-core>=1.0,<2"]
# LlamaIndex moves its memory API between minor versions.
llamaindex = ["llama-index-core>=0.14,<0.15"]
# The OpenAI Agents SDK is pre-1.0: each minor version may change its tool API.
openai-agents = ["openai-agents>=0.24,<0.25"]
# CrewAI moves its memory API between minor versions.
crewai = ["crewai>=1.15,<1.16"]
# AutoGen is pre-1.0: each minor version may change its memory protocol.
autogen = ["autogen-core>=0.7,<0.8"]
# Pydantic AI 2.68 has the ToolFailed result the adapter raises; 3.0 may change its tool API.
pydantic-ai = ["pydantic-ai-slim>=2.68,<3"]
# AG2 1.3 has the assembly policies and tool(schema=...) the adapter uses; 1.4 removes
# APIs deprecated in 1.3.
ag2 = ["ag2>=1.3,<1.4"]

[project.urls]
Homepage = "https://clickhouse.github.io/loom/"
Documentation = "https://clickhouse.github.io/loom/reference/python-sdk/"
Repository = "https://github.com/ClickHouse/loom"
Issues = "https://github.com/ClickHouse/loom/issues"

[tool.pytest.ini_options]
# The framework adapters' tests: `make test-sdk-adapters` runs each in a venv with
# the SDK and that adapter's extra, apart from the server's environment.
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.hatch.build.targets.sdist]
# Anchored to this directory: an unanchored "README.md" also matches examples/README.md.
include = [
  "/loom",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
