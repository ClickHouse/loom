include = ["*.toml", "**/*.toml"]
# Service caches preserve the bytes of their upstream repositories.
exclude = [
  "var/**",
  "tests/fixtures/**",
  "tests/unit/fixtures/knowledge/**",
  "**/node_modules/**",
  "scripts/scip_harness/vendor/**",
]

[formatting]
align_entries = false
array_auto_collapse = false
column_width = 100
