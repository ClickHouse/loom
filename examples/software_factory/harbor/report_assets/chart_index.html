<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory bar charts · Harbor</title><style>body{font:16px system-ui;background:#101318;color:#edf1f5;max-width:1000px;margin:40px auto;padding:24px}a{color:#58a9ff}li{margin:20px 0}small{color:#a6b0bd}</style><a href="/jobs">Harbor jobs</a><h1>Factory comparison charts</h1><p>Success, full end-to-end time and generation cost, grouped by issue and repeat.</p><ul id="runs"></ul><script>fetch('index.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{for(const run of Object.values(data.runs).reverse()){const li=document.createElement('li'),a=document.createElement('a'),small=document.createElement('small');a.href=run.url;a.textContent=run.name;small.textContent=` — ${run.observed}/${run.scheduled} attempts observed`;li.append(a,small);document.getElementById('runs').append(li)}})</script></html>
